function drawWeightChart(data, startWeight) {
  const canvas = document.getElementById('weightCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const pad = { top: 10, right: 10, bottom: 20, left: 34 };
  const weights = data.map(d => d.weight);
  // El rango del eje se calcula SOLO con tus pesajes reales (con un margen chico),
  // no forzando siempre a incluir el peso inicial — si ese número queda lejos de
  // tus registros recientes, obligar a incluirlo aplastaría visualmente cualquier
  // cambio real que sí hayas tenido.
  const dataMin = Math.min(...weights);
  const dataMax = Math.max(...weights);
  const span = Math.max(dataMax - dataMin, 0.5);
  const pad_ = Math.max(0.5, span * 0.25);
  const min = dataMin - pad_;
  const max = dataMax + pad_;
  const showStartRef = startWeight >= min && startWeight <= max;
  const xStep = (w - pad.left - pad.right) / Math.max(1, data.length - 1);
  const yFor = (val) => h - pad.bottom - ((val - min) / (max - min)) * (h - pad.top - pad.bottom);
  const xFor = (i) => pad.left + i * xStep;

  ctx.clearRect(0, 0, w, h);

  // línea de referencia del peso inicial, solo si cae dentro del rango visible
  if (showStartRef) {
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(pad.left, yFor(startWeight));
  ctx.lineTo(w - pad.right, yFor(startWeight));
  ctx.stroke();
  ctx.setLineDash([]);
  }

  // y labels
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(max.toFixed(0), pad.left - 6, yFor(max) + 4);
  ctx.fillText(min.toFixed(0), pad.left - 6, yFor(min) + 4);

  // line
  ctx.strokeStyle = '#FFCC00';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  data.forEach((d, i) => {
    const x = xFor(i), y = yFor(d.weight);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // dots + x labels
  ctx.textAlign = 'center';
  data.forEach((d, i) => {
    const x = xFor(i), y = yFor(d.weight);
    ctx.fillStyle = '#FFCC00';
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
    if (i === 0 || i === data.length - 1 || data.length <= 5) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText(fmtShort(new Date(d.date + 'T00:00:00')), x, h - 4);
    }
  });
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}


const PRE_RESTORE_KEY = 'runner-pre-restore-backup-v1';
function savePreRestoreSnapshot() {
  try { localStorage.setItem(PRE_RESTORE_KEY, JSON.stringify(backupPayloadObject())); } catch (_) {}
}
function hasPreRestoreSnapshot() {
  try { return !!localStorage.getItem(PRE_RESTORE_KEY); } catch (_) { return false; }
}
function undoLastRestore() {
  try {
    const raw=localStorage.getItem(PRE_RESTORE_KEY);
    if (!raw) { showToast('No hay una restauración para deshacer'); return; }
    const parsed=JSON.parse(raw);
    savePreRestoreSnapshot();
    applyRestoredData(parsed);
    localStorage.removeItem(PRE_RESTORE_KEY);
    persist(); render(); showToast('Restauración deshecha ✅');
  } catch (_) { showToast('No se pudo deshacer la restauración'); }
}

function backupPayloadObject() {
  return {
    backupVersion: 3,
    app: 'Runner',
    exportedAt: new Date().toISOString(),
    runDays: S.runDays, weighIns: S.weighIns, sessionsDone: S.sessionsDone,
    activities: S.activities, shoes: S.shoes, weightSettings: S.weightSettings, goals: S.goals,
    races: S.races, madeUpSessions: S.madeUpSessions,
  };
}

function applyRestoredData(parsed) {
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('Formato de respaldo inválido');
  if (parsed.app && parsed.app !== 'Runner') throw new Error('Este respaldo no pertenece a Runner');
  if (Array.isArray(parsed.runDays)) S.runDays = [...new Set(parsed.runDays.filter(v => typeof v === 'string'))];
  if (parsed.weighIns && typeof parsed.weighIns === 'object' && !Array.isArray(parsed.weighIns)) S.weighIns = { ...parsed.weighIns };
  if (parsed.sessionsDone && typeof parsed.sessionsDone === 'object' && !Array.isArray(parsed.sessionsDone)) S.sessionsDone = { ...parsed.sessionsDone };
  if (parsed.activities && typeof parsed.activities === 'object' && !Array.isArray(parsed.activities)) S.activities = { ...parsed.activities };
  if (parsed.shoes && typeof parsed.shoes === 'object' && !Array.isArray(parsed.shoes)) S.shoes = { ...S.shoes, ...parsed.shoes };
  if (parsed.weightSettings && typeof parsed.weightSettings === 'object' && !Array.isArray(parsed.weightSettings)) S.weightSettings = { ...S.weightSettings, ...parsed.weightSettings };
  if (parsed.goals && typeof parsed.goals === 'object' && !Array.isArray(parsed.goals)) S.goals = { ...S.goals, ...parsed.goals };
  if (Array.isArray(parsed.races)) S.races = parsed.races;
  if (parsed.madeUpSessions && typeof parsed.madeUpSessions === 'object' && !Array.isArray(parsed.madeUpSessions)) S.madeUpSessions = { ...parsed.madeUpSessions };
}

/* ---------------------------------------------------------------
   GOOGLE DRIVE BACKUP
   Requiere un Client ID de Google Cloud Console (OAuth, tipo "Aplicación
   web") con la Google Drive API activada y este origen autorizado en
   "Orígenes de JavaScript autorizados": https://martellscs-blip.github.io
   Reemplaza la constante de abajo con tu propio Client ID.
--------------------------------------------------------------- */
const GOOGLE_CLIENT_ID = '427984660518-7qtn0q5h462uuh59gbd48ar70uomennn.apps.googleusercontent.com';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let gTokenClient = null;
let gAccessToken = null;
let gTokenExpiresAt = 0;

function gdriveConfigured() {
  return !!GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith('TU_CLIENT_ID');
}

function gdriveGetToken() {
  return new Promise((resolve, reject) => {
    if (gAccessToken && Date.now() < gTokenExpiresAt - 60000) { resolve(gAccessToken); return; }
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      reject(new Error('No se pudo cargar el inicio de sesión de Google (revisa tu conexión).'));
      return;
    }
    if (!gTokenClient) {
      gTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_DRIVE_SCOPE,
        callback: () => {}, // se sobreescribe en cada llamada, ver abajo
      });
    }
    gTokenClient.callback = (resp) => {
      if (resp.error) { reject(new Error(resp.error)); return; }
      gAccessToken = resp.access_token;
      gTokenExpiresAt = Date.now() + (resp.expires_in || 3600) * 1000;
      resolve(gAccessToken);
    };
    gTokenClient.requestAccessToken({ prompt: gAccessToken ? '' : 'consent' });
  });
}

async function backupToGoogleDrive() {
  if (!gdriveConfigured()) {
    openGoogleDriveInfoModal();
    return;
  }
  S.googleDrive.syncing = true;
  S.googleDrive.error = null;
  render();

  try {
    const token = await gdriveGetToken();
    const payload = JSON.stringify(backupPayloadObject(), null, 2);

    let fileId = S.googleDrive.fileId;

    if (!fileId) {
      const searchRes = await fetch(
        `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='runner-backup.json' and trashed=false")}&spaces=drive&fields=files(id,name)`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      if (searchRes.ok) {
        const searchData = await searchRes.json();
        if (searchData.files && searchData.files[0]) fileId = searchData.files[0].id;
      }
    }

    if (fileId) {
      const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: payload,
      });
      if (!res.ok) throw new Error('No se pudo actualizar el respaldo en Drive');
    } else {
      const boundary = 'runner_backup_boundary';
      const metadata = { name: 'runner-backup.json', mimeType: 'application/json' };
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
        body,
      });
      if (!res.ok) throw new Error('No se pudo crear el respaldo en Drive');
      const data = await res.json();
      fileId = data.id;
    }

    S.googleDrive.fileId = fileId;
    S.googleDrive.lastBackupAt = new Date().toISOString();
    S.googleDrive.error = null;
    showToast('Respaldo guardado en Google Drive ✅');
  } catch (e) {
    S.googleDrive.error = 'No se pudo guardar en Google Drive';
    showToast('No se pudo guardar en Google Drive');
  } finally {
    S.googleDrive.syncing = false;
    await persist();
    render();
    refreshConnectionsModalSections();
  }
}

async function restoreFromGoogleDrive() {
  if (!gdriveConfigured()) { openGoogleDriveInfoModal(); return; }
  const ok = window.confirm('Esto va a reemplazar tu progreso actual en este dispositivo con el último respaldo guardado en Drive. ¿Continuar?');
  if (!ok) return;

  S.googleDrive.syncing = true;
  S.googleDrive.error = null;
  render();

  try {
    const token = await gdriveGetToken();
    let fileId = S.googleDrive.fileId;

    if (!fileId) {
      const searchRes = await fetch(
        `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='runner-backup.json' and trashed=false")}&spaces=drive&fields=files(id,name)`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      if (searchRes.ok) {
        const searchData = await searchRes.json();
        if (searchData.files && searchData.files[0]) fileId = searchData.files[0].id;
      }
    }
    if (!fileId) throw new Error('No se encontró ningún respaldo en tu Drive todavía');

    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) throw new Error('No se pudo descargar el respaldo');
    const data = await res.json();
    savePreRestoreSnapshot();
    applyRestoredData(data);

    S.googleDrive.fileId = fileId;
    S.googleDrive.error = null;
    showToast('Progreso restaurado desde Google Drive ✅');
  } catch (e) {
    S.googleDrive.error = e.message || 'No se pudo restaurar desde Drive';
    showToast(S.googleDrive.error);
  } finally {
    S.googleDrive.syncing = false;
    await persist();
    render();
    refreshConnectionsModalSections();
  }
}

/* ---------------------------------------------------------------
   AUTO-ACTUALIZACIÓN DEL REPO EN GITHUB
   Sube un index.html nuevo directo al repo usando la API de GitHub,
   para no tener que hacerlo manualmente desde la web de GitHub.
   Requiere un token personal de GitHub con permiso de escritura sobre

--------------------------------------------------------------- */
const GH_OWNER = 'martellscs-blip';
const GH_REPO = 'Runner';
const GH_PATH = 'index.html';
const GH_TOKEN_KEY = 'runner-gh-token';
let ghSelectedFileContent = null;
let ghSelectedFileName = null;

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

async function uploadToGithub() {
  const btn = document.getElementById('ghUploadBtn');
  const tokenInput = document.getElementById('ghTokenInput');
  const token = tokenInput ? tokenInput.value.trim() : '';

  if (!ghSelectedFileContent) { showToast('Primero escoge el archivo index.html'); return; }
  if (!token) { showToast('Falta el token de GitHub'); return; }

  localStorage.setItem(GH_TOKEN_KEY, token);
  if (btn) { btn.disabled = true; btn.textContent = 'Subiendo…'; }

  try {
    const headers = {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };

    const getRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`, { headers });
    if (!getRes.ok) throw new Error('No se pudo leer el archivo actual del repositorio (revisa el token)');
    const getData = await getRes.json();

    const putRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`, {
      method: 'PUT',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Actualiza ${GH_PATH} desde la app Runner`,
        content: utf8ToBase64(ghSelectedFileContent),
        sha: getData.sha,
      }),
    });
    if (!putRes.ok) {
      const errData = await putRes.json().catch(() => ({}));
      throw new Error(errData.message || 'No se pudo subir el archivo');
    }

    S.github = S.github || {};
    S.github.lastUpdatedAt = new Date().toISOString();
    await persist();
    showToast('Runner actualizado en GitHub ✅ (recarga en un momento)');
    document.getElementById('modalRoot').innerHTML = '';
    ghSelectedFileContent = null;
    ghSelectedFileName = null;
  } catch (e) {
    showToast(e.message || 'No se pudo subir el archivo');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = `${icon('upload',16)} Subir a GitHub`; }
  }
}

  if (S.tab === 'home') main.innerHTML = renderHome();
  else if (S.tab === 'plan') main.innerHTML = renderPlan();
  else if (S.tab === 'calendar') main.innerHTML = renderCalendar();
  else if (S.tab === 'peso') main.innerHTML = renderPeso();

  if (S.tab === 'plan') {
    // Mantiene visible la semana seleccionada en el carrusel, en vez de saltar al inicio
    requestAnimationFrame(() => {
      const strip = document.getElementById('weekChips');
      const activeChip = strip && strip.querySelector('.chip.active');
      if (strip && activeChip) {
        const target = activeChip.offsetLeft - (strip.clientWidth / 2) + (activeChip.clientWidth / 2);
        strip.scrollLeft = Math.max(0, target);
      }
    });
  }
}

document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-tab]');
  if (navBtn) { S.tab = navBtn.dataset.tab; render(); return; }

  const gotoPlan = e.target.closest('[data-goto-plan]');
  if (gotoPlan) { S.tab = 'plan'; render(); return; }

  const chip = e.target.closest('[data-week]');
  if (chip) { S.selectedWeek = parseInt(chip.dataset.week, 10); render(); return; }

  const sessionBtn = e.target.closest('[data-toggle-session]');
  if (sessionBtn) {
    const key = sessionBtn.dataset.toggleSession;
    if (S.sessionsDone[key]) { delete S.sessionsDone[key]; delete S.madeUpSessions[key]; }
    else S.sessionsDone[key] = true;
    persist();
    render();
    return;
  }

  const dayBtn = e.target.closest('[data-toggle-day]');
  if (dayBtn) {
    const dateStr = dayBtn.dataset.toggleDay;
    if (S.runDays.includes(dateStr)) S.runDays = S.runDays.filter(d => d !== dateStr);
    else S.runDays.push(dateStr);
    persist();
    render();
    return;
  }

  const calNav = e.target.closest('[data-cal-nav]');
  if (calNav) {
    const delta = parseInt(calNav.dataset.calNav, 10);
    S.calendarView = new Date(S.calendarView.getFullYear(), S.calendarView.getMonth() + delta, 1);
    render();
    return;
  }

  const backupBtn = e.target.closest('[data-backup]');
  if (backupBtn) { openBackupModal(backupBtn.dataset.backup); return; }

  const modalClose = e.target.closest('[data-modal-close]');
  if (modalClose) { document.getElementById('modalRoot').innerHTML = ''; return; }

  const overlay = e.target.closest('[data-modal-overlay]');
  if (overlay && e.target === overlay) { document.getElementById('modalRoot').innerHTML = ''; return; }

  const copyBackupBtn = e.target.closest('[data-copy-backup]');
  if (copyBackupBtn) {
    const ta = document.getElementById('backupText');
    navigator.clipboard.writeText(ta.value).then(() => {
      showToast('Respaldo copiado ✅');
    }).catch(() => {
      ta.focus(); ta.select();
      try { document.execCommand('copy'); showToast('Respaldo copiado ✅'); }
      catch (e2) { showToast('Selecciona el texto y cópialo manualmente'); }
    });
    return;
  }

  const restoreBtn = e.target.closest('[data-restore-backup]');
  if (restoreBtn) {
    const ta = document.getElementById('backupText');
    restoreBackup(ta.value);
    return;
  }

  const stravaConnectBtn = e.target.closest('[data-strava-connect]');
  if (stravaConnectBtn) { window.location.href = stravaAuthUrl(); return; }

  const goalSettingsBtn = e.target.closest('[data-goal-settings]');
  if (goalSettingsBtn) { openGoalSettingsModal(); return; }

  const goalSaveBtn = e.target.closest('[data-goal-save]');
  if (goalSaveBtn) {
    const sec=parseHMSInput(document.getElementById('goalMarathonInput')?.value);
    const weight=parseFloat(document.getElementById('goalWeightInput')?.value);
    if (!sec || sec < 2*3600 || sec > 8*3600) { showToast('Tiempo objetivo inválido'); return; }
    S.goals=S.goals||{}; S.goals.marathonTargetSec=sec; S.weightSettings.targetWeight=weight>0?weight:null; persist(); document.getElementById('modalRoot').innerHTML=''; render(); showToast('Objetivos guardados ✅'); return;
  }

  const stravaSyncBtn = e.target.closest('[data-strava-sync]');
  if (stravaSyncBtn) { syncStravaActivities(false); return; }

  const stravaDisconnectBtn = e.target.closest('[data-strava-disconnect]');
  if (stravaDisconnectBtn) { disconnectStrava(); return; }

  const gdriveBtn = e.target.closest('[data-gdrive-backup]');
  if (gdriveBtn) { backupToGoogleDrive(); return; }

  const gdriveRestoreBtn = e.target.closest('[data-gdrive-restore]');
  if (gdriveRestoreBtn) { restoreFromGoogleDrive(); return; }

  const undoRestoreBtn = e.target.closest('[data-undo-restore]');
  if (undoRestoreBtn) { if (window.confirm('Esto devolverá los datos que tenías antes de la última restauración. ¿Continuar?')) undoLastRestore(); return; }

  const openUpdateBtn = e.target.closest('[data-open-update]');
  if (openUpdateBtn) { openConnectionsModal(); return; }

  const ghPick = e.target.closest('[data-gh-pick]');
  if (ghPick) { const input = document.getElementById('ghFileInput'); if (input) input.click(); return; }

  const ghToggleInfo = e.target.closest('[data-gh-toggle-info]');
  if (ghToggleInfo) {
    const box = document.getElementById('ghRepoInfo');
    if (box) box.style.display = box.style.display === 'block' ? 'none' : 'block';
    return;
  }

  const ghUploadBtn = e.target.closest('[data-gh-upload]');
  if (ghUploadBtn) { uploadToGithub(); return; }

  const shoeEditBtn = e.target.closest('[data-shoe-edit]');
  if (shoeEditBtn) { openShoeModal(); return; }

  const shoeSaveBtn = e.target.closest('[data-shoe-save]');
  if (shoeSaveBtn) { saveShoeSettings(); return; }

  const shoeResetBtn = e.target.closest('[data-shoe-reset-today]');
  if (shoeResetBtn) { resetShoeToday(); return; }

  const weightSettingsEditBtn = e.target.closest('[data-weightsettings-edit]');
  if (weightSettingsEditBtn) { openWeightSettingsModal(); return; }

  const weightSettingsSaveBtn = e.target.closest('[data-weightsettings-save]');
  if (weightSettingsSaveBtn) { saveWeightSettings(); return; }

  const raceAddBtn = e.target.closest('[data-race-add]');
  if (raceAddBtn) { openRaceModal(null); return; }

  const raceEditBtn = e.target.closest('[data-race-edit]');
  if (raceEditBtn) { openRaceModal(raceEditBtn.dataset.raceEdit); return; }

  const raceSaveBtn = e.target.closest('[data-race-save]');
  if (raceSaveBtn) { saveRace(raceSaveBtn.dataset.raceId || null); return; }

  const raceDeleteBtn = e.target.closest('[data-race-delete]');
  if (raceDeleteBtn) { deleteRace(raceDeleteBtn.dataset.raceId); return; }
});

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-weight-date]')) {
    const dateStr = e.target.dataset.weightDate;
    const val = e.target.value;
    if (val === '') delete S.weighIns[dateStr];
    else S.weighIns[dateStr] = parseFloat(val);
    persist();
    render();
    return;
  }

  if (e.target.id === 'ghFileInput') {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      ghSelectedFileContent = reader.result;
      ghSelectedFileName = file.name;
      const label = document.getElementById('ghFileLabel');
      const drop = document.getElementById('ghDrop');
      if (label) label.textContent = file.name;
      if (drop) drop.classList.add('has-file');
    };
    reader.onerror = () => showToast('No se pudo leer el archivo');
    reader.readAsText(file, 'UTF-8');
    return;
  }

  if (e.target.id === 'raceDistanceSelect') {
    const customInput = document.getElementById('raceDistanceCustom');
    if (customInput) customInput.style.display = e.target.value === 'custom' ? 'block' : 'none';
  }
});

/* ---------------------------------------------------------------
   BLOQUEO DE SCROLL DE FONDO MIENTRAS HAY UN MODAL ABIERTO
   Se detecta automáticamente (sin tocar cada función que abre/cierra
   modales) observando cambios en #modalRoot. Fija el body en su lugar
   mientras el modal está abierto, así el gesto de deslizar solo puede
   mover el contenido del modal, nunca la pantalla de atrás.
--------------------------------------------------------------- */
(() => {
  const modalRootEl = document.getElementById('modalRoot');
  let savedScrollY = 0;
  const applyLock = () => {
    const isOpen = modalRootEl.innerHTML.trim() !== '';
    const isLocked = document.body.style.position === 'fixed';
    if (isOpen && !isLocked) {
      savedScrollY = window.scrollY;
      document.body.style.position = 'fixed';
      document.body.style.top = `-${savedScrollY}px`;
      document.body.style.width = '100%';
    } else if (!isOpen && isLocked) {
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.width = '';
      window.scrollTo(0, savedScrollY);
    }
  };
  new MutationObserver(applyLock).observe(modalRootEl, { childList: true });
})();

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
loadState().then(async () => {
  S.selectedWeek = currentWeekIndex();
  render();
  await handleStravaRedirect();
  if (stravaConnected()) {
    syncStravaActivities(true); // auto-sync silencioso cada vez que se abre la app
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* si falla, la app sigue funcionando igual */ });
}
</script>
