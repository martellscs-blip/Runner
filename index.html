<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runner</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runner">

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #000; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.font-display { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Header */
header {
  padding: 22px 20px 16px;
  background: #000;
  border-bottom: 1px solid rgba(255,204,0,0.2);
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.badge { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
.badge .diamond {
  position: absolute; inset: 0; background: #FFCC00; border: 3px solid #000;
  border-radius: 6px; transform: rotate(45deg);
}
.badge svg { position: relative; z-index: 1; }
header .brand { flex: 1; }
header .brand .title { font-size: 24px; font-weight: 700; line-height: 1; }
header .brand .tag { font-size: 11px; color: rgba(255,204,0,0.8); margin-top: 4px; font-weight: 500; }
header .countdown { text-align: right; }
header .countdown .num { font-size: 24px; font-weight: 700; color: #FFCC00; line-height: 1; }
header .countdown .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); }

/* Main */
main { flex: 1; overflow-y: auto; padding-bottom: 96px; }
.px5 { padding-left: 20px; padding-right: 20px; }
.section { padding-top: 20px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #FFCC00; font-weight: 600; margin-bottom: 4px; }
.dashed-rule { height: 3px; width: 100%; margin: 16px 0; background-image: repeating-linear-gradient(90deg, #FFCC00 0 14px, transparent 14px 24px); }

/* Cards */
.card { border-radius: 16px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 16px; }
.card-yellow-border { border-color: rgba(255,204,0,0.5); }

/* Countdown hero */
.hero {
  border-radius: 20px;
  background: linear-gradient(135deg, #FFCC00, #e6b800);
  color: #000;
  padding: 22px 20px;
  position: relative;
  overflow: hidden;
  margin-top: 20px;
}
.hero .h-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.7; }
.hero .h-num { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: 4px; }
.hero .h-sub { font-size: 14px; font-weight: 600; margin-top: 4px; }
.hero .runner-ghost { position: absolute; right: 4px; bottom: 4px; opacity: 0.9; width: 92px; height: auto; }

/* Energy progress bar */
.energy-track { position: relative; height: 16px; width: 100%; border-radius: 999px; background: #111; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
.energy-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #E6A800, #FFCC00 40%, #FFF3B0 60%, #FFCC00);
  position: relative;
  animation: energyGlow 1.8s ease-in-out infinite;
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.energy-fill::after {
  content: ""; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.55) 0px, rgba(255,255,255,0.55) 2px, transparent 2px, transparent 16px);
  mix-blend-mode: overlay; animation: energyFlow 0.7s linear infinite;
}
.bolt-tip { animation: boltPulse 1.4s ease-in-out infinite; position: absolute; top: 50%; transform: translateY(-50%); filter: drop-shadow(0 0 4px #FFCC00); }
.session-bolt { filter: drop-shadow(0 0 4px #FFCC00); }
@keyframes energyFlow { 0% { background-position: 0 0; } 100% { background-position: 32px 0; } }
@keyframes energyGlow { 0%, 100% { filter: drop-shadow(0 0 3px #FFCC00) drop-shadow(0 0 8px rgba(255,204,0,0.5)); } 50% { filter: drop-shadow(0 0 7px #FFCC00) drop-shadow(0 0 16px rgba(255,204,0,0.7)); } }
@keyframes boltPulse { 0%, 100% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.25); } }

/* Stat grid */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.stat-card { border-radius: 16px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 16px; text-align: left; }
.stat-card .val { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; }
.stat-card .lbl { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.stat-card .sub { font-size: 11px; margin-top: 4px; font-weight: 600; }
.sub-good { color: #4ade80; } .sub-bad { color: #f87171; }

/* Week card */
.week-card { width: 100%; text-align: left; border-radius: 16px; background: #151515; border: 1px solid rgba(255,204,0,0.25); padding: 16px; margin-top: 20px; }
.week-card .row { display: flex; justify-content: space-between; align-items: flex-start; }
.week-card .phase { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; }
.week-card .dates { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.pill { background: #FFCC00; color: #000; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 12px; flex-shrink: 0; }
.week-card .cta { font-size: 14px; color: rgba(255,255,255,0.7); }

/* Backup card */
.backup-card { border-radius: 16px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 16px; margin-top: 20px; margin-bottom: 20px; }
.backup-card .desc { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 12px; }
.backup-btns { display: flex; gap: 8px; }
.btn-backup { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 10px; font-weight: 600; font-size: 14px; }
.btn-backup-copy { background: #1f1a00; border: 1px solid rgba(255,204,0,0.4); color: #FFCC00; }
.btn-backup-paste { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }

/* Plan tab */
.week-chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none; }
.week-chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; width: 56px; height: 64px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #151515; color: rgba(255,255,255,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.chip .s { font-size: 10px; text-transform: uppercase; font-weight: 600; opacity: 0.7; }
.chip .n { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; line-height: 1; }
.chip.active { background: #FFCC00; border-color: #FFCC00; color: #000; }
.chip .dot { margin-top: 4px; width: 6px; height: 6px; border-radius: 999px; background: #FFCC00; }
.chip.active .dot { background: #000; }

.session-card { width: 100%; text-align: left; border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); background: #151515; position: relative; overflow: hidden; margin-bottom: 12px; transition: transform 0.1s; }
.session-card:active { transform: scale(0.98); }
.session-card.done { background: #1a1500; border-color: #FFCC00; box-shadow: 0 0 0 1px rgba(255,204,0,0.35) inset; }
.session-card .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; position: relative; z-index: 1; }
.session-card .top-left { display: flex; align-items: center; gap: 8px; }
.session-card .stitle { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: rgba(255,255,255,0.6); }
.session-card.done .stitle { color: #FFCC00; }
.session-card .stext { font-size: 14px; color: rgba(255,255,255,0.85); line-height: 1.4; position: relative; z-index: 1; }
.session-card .sfoot { font-size: 11px; font-weight: 600; margin-top: 8px; color: rgba(255,255,255,0.3); position: relative; z-index: 1; }
.session-card.done .sfoot { color: #FFCC00; }
.check-circle { width: 20px; height: 20px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.2); display: block; }

/* Calendar tab */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-nav-btn { padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.05); display: flex; }
.cal-month { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 600; padding: 4px 0; }
.cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.7); position: relative; }
.cal-day.run { background: #FFCC00; color: #000; font-weight: 700; }
.cal-day.today { box-shadow: 0 0 0 2px #FFCC00; }
.cal-day .weigh-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 999px; background: rgba(255,204,0,0.6); }
.cal-legend { display: flex; gap: 16px; margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.5); align-items: center; }
.cal-legend .sq { width: 12px; height: 12px; border-radius: 4px; background: #FFCC00; display: inline-block; margin-right: 6px; vertical-align: middle; }
.cal-legend .dt { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,204,0,0.6); display: inline-block; margin-right: 6px; vertical-align: middle; }
.cal-summary { margin-top: 20px; border-radius: 16px; background: #1f1a00; border: 1px solid rgba(255,204,0,0.3); padding: 16px; display: flex; align-items: center; justify-content: space-between; }
.cal-summary .n { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; color: #FFCC00; }

/* Peso tab */
.peso-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.peso-stat { border-radius: 12px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 12px; text-align: center; }
.peso-stat .l { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
.peso-stat .v { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; margin-top: 2px; }
.peso-stat .u { font-size: 10px; color: rgba(255,255,255,0.4); }
.chart-card { border-radius: 16px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 12px; margin-bottom: 20px; height: 170px; }
.weigh-row { display: flex; align-items: center; justify-content: space-between; border-radius: 12px; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.05); background: #151515; margin-bottom: 8px; }
.weigh-row.today { background: #1f1a00; border-color: rgba(255,204,0,0.5); }
.weigh-row.future { opacity: 0.5; }
.weigh-row .day { font-size: 14px; font-weight: 600; }
.weigh-row .date { font-size: 11px; color: rgba(255,255,255,0.5); }
.weigh-row input { width: 64px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; text-align: right; padding: 6px 8px; font-size: 14px; font-weight: 600; color: #FFCC00; }
.weigh-row input:focus { outline: none; border-color: #FFCC00; }

/* Nav */
nav.bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #000; border-top: 1px solid rgba(255,204,0,0.2); display: flex; z-index: 20; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; color: rgba(255,255,255,0.4); }
.nav-btn.active { color: #FFCC00; }
.nav-btn span { font-size: 10px; font-weight: 500; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.modal-sheet { width: 100%; max-width: 480px; background: #121212; border-radius: 24px 24px 0 0; border-top: 1px solid rgba(255,204,0,0.3); padding: 20px 20px 32px; max-height: 80vh; display: flex; flex-direction: column; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.modal-head .t { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; }
.modal-close { padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.05); }
.modal-desc { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
.modal-sheet textarea { flex: 1; min-height: 140px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; font-size: 12px; color: rgba(255,255,255,0.8); font-family: monospace; resize: none; }
.modal-sheet textarea:focus { outline: none; border-color: #FFCC00; }
.modal-btn { margin-top: 16px; width: 100%; background: #FFCC00; color: #000; font-weight: 700; border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.modal-btn:disabled { opacity: 0.4; }

/* Toast */
.toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: #FFCC00; color: #000; font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 999px; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
</style>
</head>

let S = {
  tab: 'home',
  selectedWeek: 0,
  calendarView: new Date(today.getFullYear(), today.getMonth(), 1),
  runDays: [],
  weighIns: {},
  sessionsDone: {},
};

const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage !== null;

async function loadState() {
  let parsed = null;

  if (hasClaudeStorage) {
    try {
      const r = await window.storage.get('runner-progress', false);
      if (r && r.value) parsed = JSON.parse(r.value);
    } catch (e) { /* no hay datos en Claude storage todavia, seguimos con localStorage */ }
  }

  if (!parsed) {
    try {
      const raw = localStorage.getItem('runner-progress');
      if (raw) parsed = JSON.parse(raw);
    } catch (e) { /* localStorage no disponible, se usan valores por defecto */ }
  }

  if (parsed) {
    S.runDays = parsed.runDays || [];
    S.weighIns = parsed.weighIns || {};
    S.sessionsDone = parsed.sessionsDone || {};
  }
}

async function persist() {
  const payload = JSON.stringify({
    runDays: S.runDays, weighIns: S.weighIns, sessionsDone: S.sessionsDone,
  });

  let savedOk = false;

  if (hasClaudeStorage) {
    try {
      await window.storage.set('runner-progress', payload, false);
      savedOk = true;
    } catch (e) { /* seguimos e intentamos localStorage como respaldo */ }
  }

  if (!savedOk) {
    try {
      localStorage.setItem('runner-progress', payload);
      savedOk = true;
    } catch (e) { /* localStorage tampoco disponible */ }
  }

  if (!savedOk) {
    showToast('No se pudo guardar, intenta de nuevo');
  }
}

function currentWeekIndex() {
  const idx = PLAN.findIndex(w => today >= w.start && today <= w.end);
  if (idx >= 0) return idx;
  return today < PLAN_START ? 0 : PLAN.length - 1;
}

let toastTimer = null;
function showToast(msg) {
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 2200);
}

/* ---------------------------------------------------------------
   RENDER: HOME
--------------------------------------------------------------- */
function renderHome() {
  const daysToRace = Math.max(0, Math.round((RACE_DATE - today) / DAY_MS));
  const completedSessions = S.runDays.length;
  const progressPct = Math.min(100, Math.round((completedSessions / TOTAL_SESSIONS) * 100));
  const cw = PLAN[currentWeekIndex()];

  const loggedWeights = Object.entries(S.weighIns).sort(([a],[b]) => a < b ? -1 : 1);
  const startWeight = 91;
  const lastWeight = loggedWeights.length ? loggedWeights[loggedWeights.length-1][1] : startWeight;
  const delta = +(lastWeight - startWeight).toFixed(1);
  const hasWeights = loggedWeights.length > 0;

  return `
    <div class="px5">
      <div class="hero">
        <div class="h-label">Cuenta regresiva</div>
        <div class="h-num font-display">${daysToRace}</div>
        <div class="h-sub">días para el maratón</div>
        <img src="${RUNNER_SILHOUETTE_SRC}" class="runner-ghost" alt="">
      </div>

      <div class="section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="eyebrow" style="margin-bottom:0;">Progreso del plan</div>
          <span style="font-size:12px;color:rgba(255,255,255,0.6);font-weight:500;">${completedSessions}/${TOTAL_SESSIONS} entrenamientos</span>
        </div>
        <div class="energy-track">
          <div class="energy-fill" style="width:${Math.max(progressPct,3)}%"></div>
          ${progressPct > 0 ? `<span class="bolt-tip" style="left:calc(${Math.max(progressPct,3)}% - 8px)">${icon('zap',14,'#fff')}</span>` : ''}
        </div>
        <div style="text-align:right;font-size:11px;color:#FFCC00;font-weight:600;margin-top:4px;">${progressPct}% completado</div>
      </div>

      <div class="stat-grid">
        <button class="stat-card" data-tab="calendar">
          <div style="color:#FFCC00;margin-bottom:8px;">${icon('flame',18)}</div>
          <div class="val font-display">${completedSessions}</div>
          <div class="lbl">Días corridos (calendario)</div>
        </button>
        <div class="stat-card">
          <div style="color:#FFCC00;margin-bottom:8px;">${icon(delta <= 0 ? 'trendDown' : 'trendUp', 18)}</div>
          <div class="val font-display">${hasWeights ? lastWeight + ' kg' : '— kg'}</div>
          <div class="lbl">Peso actual</div>
          <div class="sub ${delta <= 0 ? 'sub-good' : 'sub-bad'}">${hasWeights ? (delta > 0 ? '+' : '') + delta + ' kg' : 'Sin registros'}</div>
        </div>
      </div>

      <button class="week-card" data-goto-plan="1">
        <div class="row">
          <div>
            <div class="eyebrow">Semana actual · ${cw.week} de 21</div>
            <div class="phase">${cw.phase}</div>
            <div class="dates">${fmtShort(cw.start)} – ${fmtShort(cw.end)}</div>
          </div>
          <div class="pill">${cw.badge}</div>
        </div>
        <div class="dashed-rule"></div>
        <div class="cta">Toca para ver los 3 entrenamientos de esta semana →</div>
      </button>

      <div class="backup-card">
        <div class="eyebrow">Respaldo</div>
        <div class="desc">Guarda tu progreso como texto en tus Notas para no perderlo nunca.</div>
        <div class="backup-btns">
          <button class="btn-backup btn-backup-copy" data-backup="copy">${icon('copy',15)} Copiar</button>
          <button class="btn-backup btn-backup-paste" data-backup="paste">${icon('paste',15)} Pegar</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------------------------------------------------------------
   RENDER: PLAN
--------------------------------------------------------------- */
function renderPlan() {
  const w = PLAN[S.selectedWeek];
  const cwi = currentWeekIndex();
  const sessions = [
    { title: 'Día 1 · Fácil', text: w.day1, dayIndex: 1 },
    { title: 'Día 2 · Calidad', text: w.day2, dayIndex: 2 },
    { title: 'Día 3 · Larga', text: w.day3, dayIndex: 3, highlight: true },
  ];

  const chips = PLAN.map((week, i) => `
    <button class="chip ${i === S.selectedWeek ? 'active' : ''}" data-week="${i}">
      <span class="s">Sem</span>
      <span class="n font-display">${week.week}</span>
      ${i === cwi ? `<span class="dot"></span>` : ''}
    </button>
  `).join('');

  const sessionCards = sessions.map(s => {
    const key = `${w.week}-${s.dayIndex}`;
    const done = !!S.sessionsDone[key];
    const cls = done ? 'done' : '';
    return `
      <button class="session-card ${cls}" data-toggle-session="${key}">
        <div class="top-row">
          <div class="top-left">
            <span style="color:${done ? '#FFCC00' : 'rgba(255,255,255,0.5)'};display:flex;">${icon('personSmall',16)}</span>
            <span class="stitle">${s.title}</span>
          </div>
          ${done ? `<span class="session-bolt" style="display:flex;">${icon('zap',18,'#FFCC00')}</span>` : `<span class="check-circle"></span>`}
        </div>
        <div class="stext">${s.text}</div>
        <div class="sfoot">${done ? '⚡ Entrenamiento completado' : 'Toca para marcar como corrido'}</div>
      </button>
    `;
  }).join('');

  return `
    <div class="section">
      <div class="px5">
        <div class="eyebrow">Plan de 21 semanas</div>
        <div class="phase font-display" style="font-size:20px;margin-bottom:12px;">Elige tu semana</div>
      </div>
      <div class="week-chips">${chips}</div>
      <div class="px5" style="margin-top:20px;">
        <div class="card">
          <div class="row" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div style="font-size:12px;color:#FFCC00;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;">${w.phase}</div>
              <div class="dates" style="margin-top:2px;">${fmtShort(w.start)} – ${fmtShort(w.end)}</div>
            </div>
            <div class="pill">${w.badge}</div>
          </div>
        </div>
        <div style="margin-top:16px;">${sessionCards}</div>
      </div>
    </div>
  `;
}

/* ---------------------------------------------------------------
   RENDER: CALENDAR
--------------------------------------------------------------- */
function renderCalendar() {
  const year = S.calendarView.getFullYear();
  const month = S.calendarView.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(year, month, d);
    const dateStr = fmt(dt);
    const isRun = S.runDays.includes(dateStr);
    const isToday = dateStr === fmt(today);
    const isWeighDay = dt.getDay() === 1 || dt.getDay() === 5;
    cells += `
      <button class="cal-day ${isRun ? 'run' : ''} ${isToday ? 'today' : ''}" data-toggle-day="${dateStr}">
        ${isRun ? icon('zap', 14, '#000').replace('stroke-width="2"','stroke-width="3"') : d}
        ${isWeighDay && !isRun ? `<span class="weigh-dot"></span>` : ''}
      </button>
    `;
  }

  const monthRuns = S.runDays.filter(d => {
    const dt = new Date(d + 'T00:00:00');
    return dt.getFullYear() === year && dt.getMonth() === month;
  }).length;

  return `
    <div class="px5 section">
      <div class="eyebrow">Registro de carreras</div>
      <div class="phase font-display" style="font-size:20px;margin-bottom:4px;">Marca tus días de entreno</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:16px;">Toca un día para marcarlo como corrido</div>

      <div class="card">
        <div class="cal-header">
          <button class="cal-nav-btn" data-cal-nav="-1">${icon('chevLeft',18)}</button>
          <div class="cal-month">${MONTHS_ES[month]} ${year}</div>
          <button class="cal-nav-btn" data-cal-nav="1">${icon('chevRight',18)}</button>
        </div>
        <div class="cal-grid" style="margin-bottom:4px;">
          ${DOW_ES.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        </div>
        <div class="cal-grid">${cells}</div>
      </div>

      <div class="cal-legend">
        <div><span class="sq"></span>Corrido</div>
        <div><span class="dt"></span>Día de peso</div>
      </div>

      <div class="cal-summary">
        <div>
          <div style="font-size:12px;color:rgba(255,255,255,0.6);">Carreras este mes</div>
          <div class="n">${monthRuns}</div>
        </div>
        <span style="color:rgba(255,204,0,0.6);">${icon('flame',32)}</span>
      </div>
    </div>
  `;
}

/* ---------------------------------------------------------------
   RENDER: PESO
--------------------------------------------------------------- */
function renderPeso() {
  const startWeight = 91;
  const pastOrToday = WEIGH_DAYS.filter(d => d <= today).slice().reverse();
  const upcoming = WEIGH_DAYS.filter(d => d > today).slice(0, 2);
  const chartData = Object.entries(S.weighIns).sort(([a],[b]) => a < b ? -1 : 1)
    .map(([date, weight]) => ({ date, weight: parseFloat(weight) }));
  const lastWeight = chartData.length ? chartData[chartData.length-1].weight : startWeight;
  const delta = +(lastWeight - startWeight).toFixed(1);

  const rows = pastOrToday.slice(0, 10).map(d => {
    const dateStr = fmt(d);
    const isToday = dateStr === fmt(today);
    const dayLabel = d.getDay() === 1 ? 'Lunes' : 'Viernes';
    const val = S.weighIns[dateStr] !== undefined ? S.weighIns[dateStr] : '';
    return `
      <div class="weigh-row ${isToday ? 'today' : ''}">
        <div>
          <div class="day">${dayLabel} ${isToday ? '<span style="color:#FFCC00;">· Hoy</span>' : ''}</div>
          <div class="date">${fmtShort(d)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="number" step="0.1" inputmode="decimal" placeholder="—" value="${val}" data-weight-date="${dateStr}">
          <span style="font-size:12px;color:rgba(255,255,255,0.4);">kg</span>
        </div>
      </div>
    `;
  }).join('');

  const upcomingRows = upcoming.map(d => `
    <div class="weigh-row future">
      <div>
        <div class="day">${d.getDay() === 1 ? 'Lunes' : 'Viernes'}</div>
        <div class="date">${fmtShort(d)}</div>
      </div>
      <div style="font-size:12px;color:rgba(255,255,255,0.4);">Próximo</div>
    </div>
  `).join('');

  setTimeout(() => drawWeightChart(chartData, startWeight), 0);

  return `
    <div class="px5 section">
      <div class="eyebrow">Control de peso</div>
      <div class="phase font-display" style="font-size:20px;margin-bottom:4px;">Lunes y viernes</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:16px;">Registra tu peso para ver tu progreso</div>

      <div class="peso-stats">
        <div class="peso-stat"><div class="l">Inicial</div><div class="v font-display">${startWeight}</div><div class="u">kg</div></div>
        <div class="peso-stat"><div class="l">Actual</div><div class="v font-display" style="color:#FFCC00;">${lastWeight}</div><div class="u">kg</div></div>
        <div class="peso-stat"><div class="l">Cambio</div><div class="v font-display" style="color:${delta<=0?'#4ade80':'#f87171'};">${delta > 0 ? '+' : ''}${delta}</div><div class="u">kg</div></div>
      </div>

      ${chartData.length >= 2 ? `<div class="chart-card"><canvas id="weightCanvas" style="width:100%;height:100%;"></canvas></div>` : ''}

      <div class="eyebrow">Registrar</div>
      <div style="margin-top:8px;">
        ${rows}
        ${upcomingRows}
      </div>
    </div>
  `;
}

function drawWeightChart(data, startWeight) {
  const canvas = document.getElementById('weightCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const pad = { top: 10, right: 10, bottom: 20, left: 34 };
  const weights = data.map(d => d.weight);
  const min = Math.min(...weights, startWeight) - 1;
  const max = Math.max(...weights, startWeight) + 1;
  const xStep = (w - pad.left - pad.right) / Math.max(1, data.length - 1);
  const yFor = (val) => h - pad.bottom - ((val - min) / (max - min)) * (h - pad.top - pad.bottom);
  const xFor = (i) => pad.left + i * xStep;

  ctx.clearRect(0, 0, w, h);

  // reference line at start weight
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(pad.left, yFor(startWeight));
  ctx.lineTo(w - pad.right, yFor(startWeight));
  ctx.stroke();
  ctx.setLineDash([]);

  // y labels
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(max.toFixed(0), pad.left - 6, yFor(max) + 4);
  ctx.fillText(min.toFixed(0), pad.left - 6, yFor(min) + 4);

  // line
  ctx.strokeStyle = '#FFCC00';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  data.forEach((d, i) => {
    const x = xFor(i), y = yFor(d.weight);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // dots + x labels
  ctx.textAlign = 'center';
  data.forEach((d, i) => {
    const x = xFor(i), y = yFor(d.weight);
    ctx.fillStyle = '#FFCC00';
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
    if (i === 0 || i === data.length - 1 || data.length <= 5) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText(fmtShort(new Date(d.date + 'T00:00:00')), x, h - 4);
    }
  });
}

/* ---------------------------------------------------------------
   BACKUP MODAL
--------------------------------------------------------------- */
function openBackupModal(mode) {
  const root = document.getElementById('modalRoot');
  const dataStr = JSON.stringify({ runDays: S.runDays, weighIns: S.weighIns, sessionsDone: S.sessionsDone });
  root.innerHTML = `
    <div class="modal-overlay" data-modal-overlay="1">
      <div class="modal-sheet">
        <div class="modal-head">
          <div class="t font-display">${mode === 'copy' ? 'Copiar respaldo' : 'Pegar respaldo'}</div>
          <button class="modal-close" data-modal-close="1">${icon('x',18)}</button>
        </div>
        <div class="modal-desc">${mode === 'copy'
          ? 'Copia este texto y guárdalo en tus Notas. Podrás pegarlo aquí después para recuperar tu progreso.'
          : 'Pega aquí el texto de respaldo que guardaste en tus Notas.'}</div>
        <textarea id="backupText" ${mode === 'copy' ? 'readonly' : ''} placeholder="${mode === 'paste' ? 'Pega aquí tu respaldo…' : ''}">${mode === 'copy' ? dataStr : ''}</textarea>
        ${mode === 'copy'
          ? `<button class="modal-btn" data-copy-backup="1">${icon('copy',16)} Copiar al portapapeles</button>`
          : `<button class="modal-btn" data-restore-backup="1">${icon('paste',16)} Restaurar respaldo</button>`
        }
      </div>
    </div>
  `;
}

function restoreBackup(text) {
  try {
    const parsed = JSON.parse(text);
    S.runDays = Array.isArray(parsed.runDays) ? parsed.runDays : [];
    S.weighIns = parsed.weighIns && typeof parsed.weighIns === 'object' ? parsed.weighIns : {};
    S.sessionsDone = parsed.sessionsDone && typeof parsed.sessionsDone === 'object' ? parsed.sessionsDone : {};
    persist();
    document.getElementById('modalRoot').innerHTML = '';
    showToast('Respaldo restaurado ✅');
    render();
  } catch (e) {
    showToast('Ese texto no es un respaldo válido');
  }
}

/* ---------------------------------------------------------------
   MAIN RENDER + EVENTS
--------------------------------------------------------------- */
function render() {
  document.getElementById('daysToRaceHeader').textContent = Math.max(0, Math.round((RACE_DATE - today) / DAY_MS));

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === S.tab);
  });

  const main = document.getElementById('main');
  if (S.tab === 'home') main.innerHTML = renderHome();
  else if (S.tab === 'plan') main.innerHTML = renderPlan();
  else if (S.tab === 'calendar') main.innerHTML = renderCalendar();
  else if (S.tab === 'peso') main.innerHTML = renderPeso();
}

document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-tab]');
  if (navBtn) { S.tab = navBtn.dataset.tab; render(); return; }

  const gotoPlan = e.target.closest('[data-goto-plan]');
  if (gotoPlan) { S.selectedWeek = currentWeekIndex(); S.tab = 'plan'; render(); return; }

  const chip = e.target.closest('[data-week]');
  if (chip) { S.selectedWeek = parseInt(chip.dataset.week, 10); render(); return; }

  const sessionBtn = e.target.closest('[data-toggle-session]');
  if (sessionBtn) {
    const key = sessionBtn.dataset.toggleSession;
    if (S.sessionsDone[key]) delete S.sessionsDone[key];
    else S.sessionsDone[key] = true;
    persist();
    render();
    return;
  }

  const dayBtn = e.target.closest('[data-toggle-day]');
  if (dayBtn) {
    const dateStr = dayBtn.dataset.toggleDay;
    if (S.runDays.includes(dateStr)) S.runDays = S.runDays.filter(d => d !== dateStr);
    else S.runDays.push(dateStr);
    persist();
    render();
    return;
  }

  const calNav = e.target.closest('[data-cal-nav]');
  if (calNav) {
    const delta = parseInt(calNav.dataset.calNav, 10);
    S.calendarView = new Date(S.calendarView.getFullYear(), S.calendarView.getMonth() + delta, 1);
    render();
    return;
  }

  const backupBtn = e.target.closest('[data-backup]');
  if (backupBtn) { openBackupModal(backupBtn.dataset.backup); return; }

  const modalClose = e.target.closest('[data-modal-close]');
  if (modalClose) { document.getElementById('modalRoot').innerHTML = ''; return; }

  const overlay = e.target.closest('[data-modal-overlay]');
  if (overlay && e.target === overlay) { document.getElementById('modalRoot').innerHTML = ''; return; }

  const copyBackupBtn = e.target.closest('[data-copy-backup]');
  if (copyBackupBtn) {
    const ta = document.getElementById('backupText');
    navigator.clipboard.writeText(ta.value).then(() => {
      showToast('Respaldo copiado ✅');
    }).catch(() => {
      ta.focus(); ta.select();
      try { document.execCommand('copy'); showToast('Respaldo copiado ✅'); }
      catch (e2) { showToast('Selecciona el texto y cópialo manualmente'); }
    });
    return;
  }

  const restoreBtn = e.target.closest('[data-restore-backup]');
  if (restoreBtn) {
    const ta = document.getElementById('backupText');
    restoreBackup(ta.value);
    return;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-weight-date]')) {
    const dateStr = e.target.dataset.weightDate;
    const val = e.target.value;
    if (val === '') delete S.weighIns[dateStr];
    else S.weighIns[dateStr] = parseFloat(val);
    persist();
    render();
  }
});

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
loadState().then(() => {
  S.selectedWeek = currentWeekIndex();
  render();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* si falla, la app sigue funcionando igual */ });
}
</script>
