<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runner</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runner">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #000; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.font-display { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Header */
header {
  padding: 22px 20px 16px;
  background: #000;
  border-bottom: 1px solid rgba(255,204,0,0.2);
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.badge { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
.badge .diamond {
  position: absolute; inset: 0; background: #FFCC00; border: 3px solid #000;
  border-radius: 6px; transform: rotate(45deg);
}
.badge svg { position: relative; z-index: 1; }
header .brand { flex: 1; }
header .brand .title { font-size: 24px; font-weight: 700; line-height: 1; }
.header-icon-btn { width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,204,0,0.25); display: flex; align-items: center; justify-content: center; color: #FFCC00; flex-shrink: 0; }
.header-icon-btn:active { background: rgba(255,204,0,0.18); }

/* Main */
main { flex: 1; overflow-y: auto; padding-bottom: 96px; }
.px5 { padding-left: 20px; padding-right: 20px; }
.section { padding-top: 20px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #FFCC00; font-weight: 600; margin-bottom: 4px; }
.dashed-rule { height: 3px; width: 100%; margin: 16px 0; background-image: repeating-linear-gradient(90deg, #FFCC00 0 14px, transparent 14px 24px); }

/* Cards */
.card { border-radius: 16px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 16px; }
.card-yellow-border { border-color: rgba(255,204,0,0.5); }

/* Countdown hero */
.hero {
  border-radius: 20px;
  background: linear-gradient(135deg, #FFCC00, #e6b800);
  color: #000;
  padding: 22px 20px;
  position: relative;
  overflow: hidden;
  margin-top: 20px;
}
.hero .h-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.7; }
.hero .h-num { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; margin-top: 4px; }
.hero .h-sub { font-size: 14px; font-weight: 600; margin-top: 4px; }
.hero .h-date { font-size: 12px; font-weight: 600; margin-top: 10px; opacity: 0.7; }
.hero .runner-ghost { position: absolute; right: 4px; bottom: 4px; opacity: 0.9; width: 92px; height: auto; }

/* Energy progress bar */
.energy-track { position: relative; height: 16px; width: 100%; border-radius: 999px; background: #111; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
.energy-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #E6A800, #FFCC00 40%, #FFF3B0 60%, #FFCC00);
  position: relative;
  animation: energyGlow 1.8s ease-in-out infinite;
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.energy-fill::after {
  content: ""; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.55) 0px, rgba(255,255,255,0.55) 2px, transparent 2px, transparent 16px);
  mix-blend-mode: overlay; animation: energyFlow 0.7s linear infinite;
}
.bolt-tip { animation: boltPulse 1.4s ease-in-out infinite; position: absolute; top: 50%; transform: translateY(-50%); filter: drop-shadow(0 0 4px #FFCC00); }
.session-bolt { filter: drop-shadow(0 0 4px #FFCC00); }
@keyframes energyFlow { 0% { background-position: 0 0; } 100% { background-position: 32px 0; } }
@keyframes energyGlow { 0%, 100% { filter: drop-shadow(0 0 3px #FFCC00) drop-shadow(0 0 8px rgba(255,204,0,0.5)); } 50% { filter: drop-shadow(0 0 7px #FFCC00) drop-shadow(0 0 16px rgba(255,204,0,0.7)); } }
@keyframes boltPulse { 0%, 100% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.25); } }

/* Stat grid */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.stat-card { border-radius: 14px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 10px 12px; text-align: left; }
.stat-card .val { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; line-height: 1; }
.stat-card .lbl { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 3px; }
.stat-card .sub { font-size: 10px; margin-top: 3px; font-weight: 600; }
.sub-good { color: #4ade80; } .sub-bad { color: #f87171; }

/* Week card */
.week-card { width: 100%; text-align: left; border-radius: 16px; background: #151515; border: 1px solid rgba(255,204,0,0.25); padding: 16px; margin-top: 20px; }
.week-card .row { display: flex; justify-content: space-between; align-items: flex-start; }
.week-card .phase { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 18px; }
.week-card .dates { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.pill { background: #FFCC00; color: #000; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 12px; flex-shrink: 0; }
.week-card .cta { font-size: 14px; color: rgba(255,255,255,0.7); }

/* Backup card */
.backup-card { border-radius: 16px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 16px; margin-top: 20px; margin-bottom: 20px; }
.backup-card .desc { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 12px; }
.backup-btns { display: flex; gap: 8px; }
.btn-backup { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 10px; font-weight: 600; font-size: 14px; }
.btn-backup-copy { background: #1f1a00; border: 1px solid rgba(255,204,0,0.4); color: #FFCC00; }
.btn-backup-paste { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }

/* GitHub self-update modal */
.gh-drop { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed rgba(255,255,255,0.25); border-radius: 14px; padding: 20px; margin-top: 10px; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
.gh-drop.has-file { border-color: #FFCC00; color: #FFCC00; }
.gh-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(255,255,255,0.4); margin-top: 16px; }
.gh-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: #fff; font-size: 14px; margin-top: 6px; }
.gh-input:focus { outline: none; border-color: #FFCC00; }
.gh-hint { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; }
.gh-repo-toggle { display: block; margin: 14px auto 0; font-size: 12px; color: rgba(255,255,255,0.4); text-decoration: underline; background: none; }
.gh-repo-info { display: none; margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.5); line-height: 1.6; }

/* Plan tab */
.week-chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none; }
.week-chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; width: 56px; height: 64px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #151515; color: rgba(255,255,255,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.chip .s { font-size: 10px; text-transform: uppercase; font-weight: 600; opacity: 0.7; }
.chip .n { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; line-height: 1; }
.chip.active { background: #FFCC00; border-color: #FFCC00; color: #000; }
.chip .dot { margin-top: 4px; width: 6px; height: 6px; border-radius: 999px; background: #FFCC00; }
.chip.active .dot { background: #000; }

.session-card { width: 100%; text-align: left; border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); background: #151515; position: relative; overflow: hidden; margin-bottom: 12px; transition: transform 0.1s; }
.session-card:active { transform: scale(0.98); }
.session-card.done { background: #1a1500; border-color: #FFCC00; box-shadow: 0 0 0 1px rgba(255,204,0,0.35) inset; }
.session-card .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; position: relative; z-index: 1; }
.session-card .top-left { display: flex; align-items: center; gap: 8px; }
.session-card .stitle { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: rgba(255,255,255,0.6); }
.session-card.done .stitle { color: #FFCC00; }
.session-card .stext { font-size: 14px; color: rgba(255,255,255,0.85); line-height: 1.4; position: relative; z-index: 1; }
.session-card .sfoot { font-size: 11px; font-weight: 600; margin-top: 8px; color: rgba(255,255,255,0.3); position: relative; z-index: 1; }
.session-card.done .sfoot { color: #FFCC00; }
.check-circle { width: 20px; height: 20px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.2); display: block; }

/* Calendar tab */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-nav-btn { padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.05); display: flex; }
.cal-month { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 600; padding: 4px 0; }
.cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.7); position: relative; }
.cal-day.run { background: #FFCC00; color: #000; font-weight: 700; }
.cal-day.today { box-shadow: 0 0 0 2px #FFCC00; }
.cal-day .weigh-dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 999px; background: rgba(255,204,0,0.6); }
.cal-legend { display: flex; gap: 16px; margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.5); align-items: center; }
.cal-legend .sq { width: 12px; height: 12px; border-radius: 4px; background: #FFCC00; display: inline-block; margin-right: 6px; vertical-align: middle; }
.cal-legend .dt { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,204,0,0.6); display: inline-block; margin-right: 6px; vertical-align: middle; }
.cal-summary { margin-top: 20px; border-radius: 16px; background: #1f1a00; border: 1px solid rgba(255,204,0,0.3); padding: 16px; display: flex; align-items: center; justify-content: space-between; }
.cal-summary .n { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; color: #FFCC00; }

/* Peso tab */
.peso-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.peso-stat { border-radius: 12px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 12px; text-align: center; }
.peso-stat .l { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
.peso-stat .v { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; margin-top: 2px; }
.peso-stat .u { font-size: 10px; color: rgba(255,255,255,0.4); }
.chart-card { border-radius: 16px; background: #151515; border: 1px solid rgba(255,255,255,0.05); padding: 12px; margin-bottom: 20px; height: 170px; }
.weigh-row { display: flex; align-items: center; justify-content: space-between; border-radius: 12px; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.05); background: #151515; margin-bottom: 8px; }
.weigh-row.today { background: #1f1a00; border-color: rgba(255,204,0,0.5); }
.weigh-row.future { opacity: 0.5; }
.weigh-row .day { font-size: 14px; font-weight: 600; }
.weigh-row .date { font-size: 11px; color: rgba(255,255,255,0.5); }
.weigh-row input { width: 64px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; text-align: right; padding: 6px 8px; font-size: 14px; font-weight: 600; color: #FFCC00; }
.weigh-row input:focus { outline: none; border-color: #FFCC00; }

/* Nav */
nav.bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #000; border-top: 1px solid rgba(255,204,0,0.2); display: flex; z-index: 20; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; color: rgba(255,255,255,0.4); }
.nav-btn.active { color: #FFCC00; }
.nav-btn span { font-size: 10px; font-weight: 500; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.modal-sheet { width: 100%; max-width: 480px; background: #121212; border-radius: 24px 24px 0 0; border-top: 1px solid rgba(255,204,0,0.3); padding: 20px 20px 32px; max-height: 80vh; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.modal-head .t { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; }
.modal-close { padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.05); }
.modal-desc { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
.modal-sheet textarea { flex: 1; min-height: 140px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; font-size: 12px; color: rgba(255,255,255,0.8); font-family: monospace; resize: none; }
.modal-sheet textarea:focus { outline: none; border-color: #FFCC00; }
.modal-btn { margin-top: 16px; width: 100%; background: #FFCC00; color: #000; font-weight: 700; border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.modal-btn:disabled { opacity: 0.4; }

/* Toast */
.toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: #FFCC00; color: #000; font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 999px; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
</style>
</head>

function parsePlanTarget(text) {
  const raw = String(text || '');
  const rangeKm = raw.match(/(\d+(?:[.,]\d+)?)\s*[-–]\s*(\d+(?:[.,]\d+)?)\s*km\b/i);
  if (rangeKm) {
    return { unit: 'km', min: Number(rangeKm[1].replace(',', '.')), max: Number(rangeKm[2].replace(',', '.')), label: `${rangeKm[1].replace(',', '.')}–${rangeKm[2].replace(',', '.')} km` };
  }
  const km = raw.match(/(\d+(?:[.,]\d+)?)\s*km\b/i);
  if (km) {
    const value = Number(km[1].replace(',', '.'));
    return { unit: 'km', min: value, max: value, label: `${value} km` };
  }
  const minutes = raw.match(/(\d+(?:[.,]\d+)?)\s*min\b/i);
  if (minutes) {
    const value = Number(minutes[1].replace(',', '.'));
    return { unit: 'min', min: value, max: value, label: `${value} min` };
  }
  return { unit: null, min: null, max: null, label: raw || '—' };
}

  const day2Date = addDays(start, 5); // sábado
  const day3Date = addDays(start, 6); // domingo
  const sessionTargets = [parsePlanTarget(w.day1), parsePlanTarget(w.day2), parsePlanTarget(w.day3)];
  const longRunTarget = sessionTargets[2];
  return { ...w, week: i + 1, start, end, day1Date, day2Date, day3Date, sessionTargets, longRunTarget };
});

function raceLabelForDistance(km) {

}

const WEIGH_DAYS = (() => {
  const out = [];

  while (d <= RACE_DATE) {

    d = addDays(d, 1);
  }
  return out;
})();

const STRAVA_CLIENT_SECRET = 'd6c812b645e4d0c62d0587c3cc2f4b0cdbd28c55';
const STRAVA_REDIRECT_URI = 'https://martellscs-blip.github.io/Runner/';
const STRAVA_SCOPE = 'activity:read_all,profile:read_all';
const STRAVA_API_BASE = 'https://www.strava.com/api/v3';

function makeOAuthState() {
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
}

function stravaAuthUrl() {
  const state = makeOAuthState();
  try { sessionStorage.setItem('runner-strava-oauth-state', state); } catch (_) {}
  const params = new URLSearchParams({
    client_id: STRAVA_CLIENT_ID,
    redirect_uri: STRAVA_REDIRECT_URI,
    response_type: 'code',
    approval_prompt: 'auto',
    scope: STRAVA_SCOPE,
    state,
  });
  return `${STRAVA_OAUTH_BASE}/authorize?${params.toString()}`;
}

function stravaConnected() {
  return !!(S.strava.accessToken && S.strava.refreshToken);
}

async function exchangeStravaCode(code) {
  try {
    const res = await fetch(`${STRAVA_OAUTH_BASE}/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        client_id: STRAVA_CLIENT_ID,
        client_secret: STRAVA_CLIENT_SECRET,
        code,
        grant_type: 'authorization_code',
      }),
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(`token exchange failed: ${res.status}${detail ? ` — ${detail.slice(0,180)}` : ''}`);
    }
    const data = await res.json();
    S.strava.accessToken = data.access_token;
    S.strava.refreshToken = data.refresh_token;
    S.strava.expiresAt = data.expires_at;
    S.strava.athleteId = data.athlete && data.athlete.id;
    S.strava.athleteName = data.athlete ? `${data.athlete.firstname || ''} ${data.athlete.lastname || ''}`.trim() : null;
    S.strava.error = null;
    await persist();
    showToast('Strava conectado ✅');
    return true;
  } catch (e) {
    S.strava.error = 'No se pudo conectar con Strava';
    showToast('No se pudo conectar con Strava');
    return false;
  }
}

async function refreshStravaTokenIfNeeded(force = false) {
  if (!stravaConnected()) return false;
  const nowSec = Math.floor(Date.now() / 1000);
  if (!force && S.strava.expiresAt && S.strava.expiresAt - nowSec > 300) return true; // sigue vigente
  try {
    const res = await fetch(`${STRAVA_OAUTH_BASE}/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        client_id: STRAVA_CLIENT_ID,
        client_secret: STRAVA_CLIENT_SECRET,
        refresh_token: S.strava.refreshToken,
        grant_type: 'refresh_token',
      }),
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(`refresh failed: ${res.status}${detail ? ` — ${detail.slice(0,180)}` : ''}`);
    }
    const data = await res.json();
    S.strava.accessToken = data.access_token;
    S.strava.refreshToken = data.refresh_token;
    S.strava.expiresAt = data.expires_at;
    await persist();
    return true;
  } catch (e) {
    S.strava.error = 'Falló la renovación del acceso a Strava. Reconecta.';
    return false;
  }
}

function disconnectStrava() {
  S.strava = {
    accessToken: null, refreshToken: null, expiresAt: 0,
    athleteId: null, athleteName: null,
    lastSyncEpoch: 0, syncing: false, lastSyncAt: null, error: null,

  persist();
  showToast('Strava desconectado');
  render();

}

function secToPaceStr(movingTimeSec, distanceMeters) {
  if (!distanceMeters) return '—';
  const secPerKm = Math.round(movingTimeSec / (distanceMeters / 1000));
  const m = Math.floor(secPerKm / 60);
  const s = secPerKm % 60;
  return `${m}:${s.toString().padStart(2, '0')} /km`;
}

function secToDuration(sec) {
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// Marca automáticamente la sesión del plan que corresponde a esta carrera.
// 1) Si coincide exacto con el día asignado (vie/sáb/dom), marca esa sesión.
// 2) Si no coincide (carrera "extra"), rellena la sesión pendiente MÁS ANTIGUA
//    desde el inicio del plan hasta la semana actual (nunca semanas futuras) —
//    así corres de más y repones huecos viejos en orden, en vez de perderla.
function autoMarkSession(dateObj) {
  const weekIdx = PLAN.findIndex(w => dateObj >= w.start && dateObj <= w.end);
  if (weekIdx < 0) return;
  const week = PLAN[weekIdx];
  const dateStr = fmt(dateObj);

  const exactMap = [[1, week.day1Date], [2, week.day2Date], [3, week.day3Date]];
  for (const [dayIdx, d] of exactMap) {
    if (fmt(d) === dateStr) {
      S.sessionsDone[`${week.week}-${dayIdx}`] = true;
      return;
    }
  }

  for (let i = 0; i <= weekIdx; i++) {
    const w = PLAN[i];
    for (const dayIdx of [1, 2, 3]) {
      const key = `${w.week}-${dayIdx}`;
      if (!S.sessionsDone[key]) {
        S.sessionsDone[key] = true;
        S.madeUpSessions[key] = { date: dateStr, weekAssigned: w.week, dayAssigned: dayIdx };
        return;
      }
    }
  }
}

async function syncStravaActivities(silent) {
  if (!stravaConnected()) return;
  const ok = await refreshStravaTokenIfNeeded();
  if (!ok) { render(); return; }

  S.strava.syncing = true;
  if (!silent) render();

  try {
    const after = Math.max(Math.floor(PLAN_START.getTime() / 1000) - 86400, (S.strava.lastSyncEpoch || 0) - 7 * 86400);
    let page = 1;
    let newCount = 0;
    let maxEpoch = after;

    while (true) {
      const params = new URLSearchParams({ after: String(after), per_page: '100', page: String(page) });
      const res = await fetch(`${STRAVA_API_BASE}/athlete/activities?${params.toString()}`, {
        headers: { Authorization: `Bearer ${S.strava.accessToken}` },
      });
      if (!res.ok) {
        let detail = '';
        try { detail = await res.text(); } catch (_) {}
        if (res.status === 401 && page === 1) {
          const refreshed = await refreshStravaTokenIfNeeded(true);
          if (refreshed) {
            const retry = await fetch(`${STRAVA_API_BASE}/athlete/activities?${params.toString()}`, { headers: { Authorization: `Bearer ${S.strava.accessToken}` } });
            if (retry.ok) {
              const retryList = await retry.json();
              // Procesa esta primera página usando el mismo flujo principal.
              for (const act of retryList) {
                const sportType = act.sport_type || act.type;
                const epoch = Math.floor(new Date(act.start_date).getTime() / 1000);
                if (epoch > maxEpoch) maxEpoch = epoch;
                if (!['Run','TrailRun'].includes(sportType)) continue;
                const isNewActivity = !S.activities[act.id];
                const startLocal = new Date(act.start_date_local);
                const dateStr = fmt(startLocal);
                S.activities[act.id] = {
                  id: act.id, name: act.name, sportType, date: dateStr, startLocal: act.start_date_local,
                  distanceKm: +(act.distance / 1000).toFixed(2), movingTimeSec: act.moving_time, elapsedTimeSec: act.elapsed_time,
                  paceStr: secToPaceStr(act.moving_time, act.distance), elevationGain: act.total_elevation_gain,
                  calories: act.calories || null, avgHr: act.average_heartrate || null, maxHr: act.max_heartrate || null,
                  avgCadence: act.average_cadence || null, workoutType: act.workout_type, avgSpeed: act.average_speed,
                  maxSpeed: act.max_speed, kudos: act.kudos_count, prCount: act.pr_count,
                };
                if (!S.runDays.includes(dateStr)) S.runDays.push(dateStr);
                autoMarkSession(startLocal);
                if (isNewActivity) newCount++;
              }
              break;
            }
          }
        }
        throw new Error(`activities fetch failed: ${res.status}${detail ? ` — ${detail.slice(0,180)}` : ''}`);
      }
      const list = await res.json();
      if (!list.length) break;

      for (const act of list) {
        const sportType = act.sport_type || act.type;
        const epoch = Math.floor(new Date(act.start_date).getTime() / 1000);
        if (epoch > maxEpoch) maxEpoch = epoch;
        const isRun = ['Run', 'TrailRun'].includes(sportType);
        if (!isRun) continue; // solo carreras: se ignoran pesas, ciclismo, caminata, etc.

        const isNewActivity = !S.activities[act.id];
        const startLocal = new Date(act.start_date_local);
        const dateStr = fmt(startLocal);

        S.activities[act.id] = {
          id: act.id,
          name: act.name,
          sportType,
          date: dateStr,
          startLocal: act.start_date_local,
          distanceKm: +(act.distance / 1000).toFixed(2),
          movingTimeSec: act.moving_time,
          elapsedTimeSec: act.elapsed_time,
          paceStr: secToPaceStr(act.moving_time, act.distance),
          elevationGain: act.total_elevation_gain,
          calories: act.calories || null,
          avgHr: act.average_heartrate || null,
          maxHr: act.max_heartrate || null,
          avgCadence: act.average_cadence || null,
          workoutType: act.workout_type,
          avgSpeed: act.average_speed,
          maxSpeed: act.max_speed,
          kudos: act.kudos_count,
          prCount: act.pr_count,
        };
        if (!S.runDays.includes(dateStr)) S.runDays.push(dateStr);
        autoMarkSession(startLocal);
        if (isNewActivity) newCount++;
      }

      if (list.length < 100) break;
      page++;
    }

    S.strava.lastSyncEpoch = maxEpoch;
    S.strava.lastSyncAt = new Date().toISOString();
    S.strava.error = null;
    await persist();
    if (newCount > 0 && !silent) showToast(`${newCount} actividad(es) sincronizada(s) ✅`);
  } catch (e) {
    console.error('Strava sync error:', e);
    const status = String(e && e.message || '').match(/\b(401|403|429|500|502|503)\b/)?.[1];
    S.strava.error = status === '401'
      ? 'Strava rechazó el acceso (401). Se intentó renovar el token; si persiste, reconecta la cuenta.'
      : status === '429'
        ? 'Strava alcanzó el límite de solicitudes. Intenta más tarde.'
        : (String(e && e.message || '').includes('403') ? 'Strava denegó el acceso (403). Revisa que la autorización incluya actividad.' : String(e && e.message || '').includes('500') || String(e && e.message || '').includes('502') || String(e && e.message || '').includes('503') ? 'Strava no respondió correctamente. Intenta de nuevo en unos minutos.' : 'No se pudo sincronizar con Strava');
    if (!silent) showToast(S.strava.error);
  } finally {
    S.strava.syncing = false;
    render();
    refreshConnectionsModalSections();
  }
}

async function handleStravaRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const returnedState = params.get('state');
  let savedState = null;
  try { savedState = sessionStorage.getItem('runner-strava-oauth-state'); sessionStorage.removeItem('runner-strava-oauth-state'); } catch (_) {}
  if (error) {
    showToast(error === 'access_denied' ? 'Conexión con Strava cancelada' : `Strava devolvió un error: ${error}`);
    window.history.replaceState({}, '', STRAVA_REDIRECT_URI);
    return;
  }
  if (code) {
    if (!savedState || returnedState !== savedState) {
      S.strava.error = 'No se pudo validar la conexión con Strava. Intenta conectar de nuevo.';
      showToast(S.strava.error);
      window.history.replaceState({}, '', STRAVA_REDIRECT_URI);
      return;
    }
    const connected = await exchangeStravaCode(code);
    window.history.replaceState({}, '', STRAVA_REDIRECT_URI);
    if (connected) await syncStravaActivities(true);
  }
}

async function loadState() {
  let parsed = null;

  if (hasClaudeStorage) {
    try {
      const r = await window.storage.get('runner-progress', false);
      if (r && r.value) parsed = JSON.parse(r.value);
    } catch (e) { /* no hay datos en Claude storage todavia, seguimos con localStorage */ }
  }

  if (!parsed) {
    try {
      const raw = localStorage.getItem('runner-progress');
      if (raw) parsed = JSON.parse(raw);
    } catch (e) { /* localStorage no disponible, se usan valores por defecto */ }
  }

  if (parsed) {
    S.runDays = parsed.runDays || [];
    S.weighIns = parsed.weighIns || {};
    S.sessionsDone = parsed.sessionsDone || {};
    S.activities = parsed.activities || {};
    if (parsed.strava) S.strava = { ...S.strava, ...parsed.strava, syncing: false };
    if (parsed.googleDrive) S.googleDrive = { ...S.googleDrive, ...parsed.googleDrive, syncing: false };
    if (parsed.github) S.github = { ...S.github, ...parsed.github };
    if (parsed.shoes) S.shoes = { ...S.shoes, ...parsed.shoes };
    if (parsed.weightSettings) S.weightSettings = { ...S.weightSettings, ...parsed.weightSettings };
    if (parsed.goals) S.goals = { ...S.goals, ...parsed.goals };
    if (Array.isArray(parsed.races)) S.races = parsed.races;
    if (parsed.madeUpSessions && typeof parsed.madeUpSessions === 'object') S.madeUpSessions = parsed.madeUpSessions;
  }
}

async function persist() {
  const payload = JSON.stringify({
    runDays: S.runDays, weighIns: S.weighIns, sessionsDone: S.sessionsDone,
    activities: S.activities, strava: S.strava,
    googleDrive: S.googleDrive, github: S.github, shoes: S.shoes,
    weightSettings: S.weightSettings, goals: S.goals, races: S.races,
    madeUpSessions: S.madeUpSessions,
  });

  let savedOk = false;

  if (hasClaudeStorage) {
    try {
      await window.storage.set('runner-progress', payload, false);
      savedOk = true;
    } catch (e) { /* seguimos e intentamos localStorage como respaldo */ }
  }

  if (!savedOk) {
    try {
      localStorage.setItem('runner-progress', payload);
      savedOk = true;
    } catch (e) { /* localStorage tampoco disponible */ }
  }

  if (!savedOk) {
    showToast('No se pudo guardar, intenta de nuevo');
  }
}

function currentWeekIndex() {
  const idx = PLAN.findIndex(w => today >= w.start && today <= w.end);
  if (idx >= 0) return idx;
  return today < PLAN_START ? 0 : PLAN.length - 1;
}

function getTrainingStats() {
  const runs = Object.values(S.activities).filter(a => ['Run','TrailRun'].includes(a.sportType));
  const cutoff7 = new Date(today); cutoff7.setDate(cutoff7.getDate() - 6);
  const cutoff28 = new Date(today); cutoff28.setDate(cutoff28.getDate() - 27);
  const inRange = (a, cutoff) => { const d = new Date(a.date + 'T00:00:00'); return d >= cutoff && d <= today; };
  const last7 = runs.filter(a => inRange(a, cutoff7));
  const last28 = runs.filter(a => inRange(a, cutoff28));
  const km7 = last7.reduce((sum,a) => sum + (a.distanceKm || 0), 0);
  const km28 = last28.reduce((sum,a) => sum + (a.distanceKm || 0), 0);
  const longest7 = last7.reduce((max,a) => Math.max(max, a.distanceKm || 0), 0);
  const recentPaces = last7.filter(a => a.movingTimeSec && a.distanceKm > 0).map(a => a.movingTimeSec / a.distanceKm);
  const avgPaceSec = recentPaces.length ? recentPaces.reduce((a,b) => a+b,0) / recentPaces.length : null;
  const weeksWithRuns = new Set(last28.map(a => { const d=new Date(a.date+'T00:00:00'); const day=d.getDay(); const monday=new Date(d); monday.setDate(d.getDate() - ((day+6)%7)); return fmt(monday); })).size;
  const consistency = Math.round((weeksWithRuns / 4) * 100);
  let loadStatus = 'Sin suficientes datos';
  let loadTone = 'rgba(255,255,255,0.5)';
  if (last28.length >= 3) {
    if (km7 > (km28 / 4) * 1.25) { loadStatus = 'Volumen alto esta semana'; loadTone = '#facc15'; }
    else if (km7 < (km28 / 4) * 0.55) { loadStatus = 'Volumen bajo esta semana'; loadTone = '#facc15'; }
    else { loadStatus = 'Volumen estable'; loadTone = '#4ade80'; }
  }
  return { km7:+km7.toFixed(1), km28:+km28.toFixed(1), longest7:+longest7.toFixed(1), avgPaceSec, consistency:Math.min(100,consistency), loadStatus, loadTone };
}

function formatPaceSeconds(sec) {
  if (!sec || !isFinite(sec)) return '—';
  const total = Math.round(sec);
  return `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')} /km`;
}

function getWeekKmOffset(offset) {
  const idx = currentWeekIndex() + offset;
  if (idx < 0 || idx >= PLAN.length) return 0;
  return weekRealKm(PLAN[idx]);
}

function getCurrentWeekLongRunTarget() {
  const w = PLAN[currentWeekIndex()];
  return w?.longRunTarget || { unit: null, min: null, max: null, label: '—' };
}

function getCurrentWeekTarget() {
  const target = getCurrentWeekLongRunTarget();
  return target.unit === 'km' ? target.min : 0;
}

function computeLoadAnalytics() {
  const runs = Object.values(S.activities).filter(a => ['Run','TrailRun'].includes(a.sportType));
  const acuteStart = addDays(today, -6);
  const chronicStart = addDays(today, -27);
  const prior21Start = addDays(today, -27);
  const prior21End = addDays(today, -7);
  const inRange = (a, start, end = today) => {
    const d = new Date(a.date + 'T00:00:00');
    return d >= start && d <= end;
  };
  const km7 = runs.filter(a => inRange(a, acuteStart)).reduce((s,a)=>s+(Number(a.distanceKm)||0),0);
  const km28 = runs.filter(a => inRange(a, chronicStart)).reduce((s,a)=>s+(Number(a.distanceKm)||0),0);
  const prior21Km = runs.filter(a => inRange(a, prior21Start, prior21End)).reduce((s,a)=>s+(Number(a.distanceKm)||0),0);
  const chronicWeeklyAvg = prior21Km / 3;
  const ratio = chronicWeeklyAvg > 0 ? km7 / chronicWeeklyAvg : null;
  const previous7Start = addDays(today, -13), previous7End = addDays(today, -7);
  const prev7 = runs.filter(a => inRange(a, previous7Start, previous7End)).reduce((s,a)=>s+(Number(a.distanceKm)||0),0);
  const changePct = prev7 > 0 ? ((km7-prev7)/prev7)*100 : null;
  let status='Sin suficientes datos', tone='rgba(255,255,255,.5)';
  if (ratio !== null) {
    if (ratio >= 1.5) { status='Distancia reciente muy superior a la media previa'; tone='#f87171'; }
    else if (ratio >= 1.3) { status='Distancia reciente superior a la media previa'; tone='#facc15'; }
    else if (ratio < 0.6) { status='Distancia reciente inferior a la media previa'; tone='#facc15'; }
    else { status='Distancia reciente estable respecto a la media previa'; tone='#4ade80'; }
  }
  return {
    km7:+km7.toFixed(1),
    km28:+km28.toFixed(1),
    prev7:+prev7.toFixed(1),
    prior21Km:+prior21Km.toFixed(1),
    chronicWeeklyAvg:+chronicWeeklyAvg.toFixed(1),
    changePct:changePct===null?null:+changePct.toFixed(1),
    acwr:ratio===null?null:+ratio.toFixed(2),
    status,tone
  };
}

function computePaceHrTrend() {
  const rows = Object.values(S.activities)
    .filter(a => ['Run','TrailRun'].includes(a.sportType))
    .filter(a => a.date <= fmt(today) && a.avgHr && a.movingTimeSec && a.distanceKm >= 3 && a.avgSpeed > 0)
    .filter(a => a.workoutType === 0 || a.workoutType === 2 || a.workoutType === undefined || a.workoutType === null)
    .sort((a,b)=>String(a.startLocal || a.date).localeCompare(String(b.startLocal || b.date)));
  if (!rows.length) return null;
  const recent = rows.slice(-6);
  const ef = recent.map(a => (a.avgSpeed * 60) / a.avgHr);
  // Con 4+ puntos usamos regresión lineal (usa todos los datos, un solo día raro
  // no distorsiona el resultado) — la misma técnica que ya validamos en el EF de Plan.
  // Con menos de 4, no hay base suficiente para hablar de tendencia real.
  let change = 0, reliable = false;
  if (ef.length >= 4) {
    const trend = linearRegression(ef.map((v, i) => ({ x: i, y: v })));
    if (trend) {
      const fittedFirst = trend.intercept;
      const fittedLast = trend.intercept + trend.slope * (ef.length - 1);
      change = fittedFirst > 0 ? ((fittedLast - fittedFirst) / fittedFirst) * 100 : 0;
      reliable = true;
    }
  } else if (ef.length >= 2) {
    const first = ef[0], last = ef[ef.length - 1];
    change = first > 0 ? ((last - first) / first) * 100 : 0;
  }
  return { rows: recent, ef, change: +change.toFixed(1), reliable };
}

function getCompletedExpectedSessionCount() {
  let expected = 0, done = 0;
  PLAN.forEach(w => {
    [[1,w.day1Date],[2,w.day2Date],[3,w.day3Date]].forEach(([dayIdx,d]) => {
      if (d <= today) {
        expected++;
        if (S.sessionsDone[`${w.week}-${dayIdx}`]) done++;
      }
    });
  });
  return { expected, done };
}

function computeCoach() {
  const load = computeLoadAnalytics();
  const weekKm = weekRealKm(PLAN[currentWeekIndex()]);
  const progress = computeProgressStats();
  const compliance = progress?.compliancePct ?? null;
  const paceHr = computePaceHrTrend();
  const target = getCurrentWeekLongRunTarget();
  const todayLongRun = PLAN[currentWeekIndex()] ? weekLongRunRealKm(PLAN[currentWeekIndex()]) : 0;

  // Índice descriptivo 0–100. No pretende medir una variable fisiológica real.
  const components = [];
  if (compliance !== null) components.push({ value: compliance, weight: 0.45 });
  if (load.acwr !== null) {
    const loadScore = Math.max(0, Math.min(100, 100 - Math.abs(load.acwr - 1) * 100));
    components.push({ value: loadScore, weight: 0.30 });
  }
  if (target.unit === 'km' && target.min > 0 && today >= PLAN[currentWeekIndex()].day3Date) {
    const longRunScore = Math.max(0, Math.min(100, (todayLongRun / target.min) * 100));
    components.push({ value: longRunScore, weight: 0.15 });
  }
  if (paceHr) {
    const efficiencyScore = Math.max(0, Math.min(100, 50 + paceHr.change * 5));
    components.push({ value: efficiencyScore, weight: 0.10 });
  }
  const weightSum = components.reduce((s,c)=>s+c.weight,0);
  const score = weightSum ? Math.round(components.reduce((s,c)=>s+c.value*c.weight,0)/weightSum) : null;

  const rec=[];
  if (load.acwr !== null && load.acwr >= 1.3) rec.push('La distancia de los últimos 7 días está por encima de tu media semanal de las 3 semanas anteriores; evita aumentos bruscos.');
  else if (load.acwr !== null && load.acwr < 0.6) rec.push('La distancia de los últimos 7 días está bastante por debajo de tu media previa; si estás retomando, aumenta gradualmente.');
  if (target.unit === 'km' && todayLongRun < target.min && today >= PLAN[currentWeekIndex()].day3Date) rec.push(`Tirada larga: ${todayLongRun.toFixed(1)} km de ${target.label} planificados.`);
  if (target.unit === 'min' && todayLongRun > 0) rec.push(`La tirada larga de esta semana está expresada en tiempo (${target.label}); Runner no la convierte a kilómetros.`);
  if (paceHr && paceHr.change > 2) rec.push('La eficiencia ritmo/FC reciente ha mejorado; compárala solo entre rodajes de esfuerzo y condiciones similares.');
  if (!rec.length) rec.push('Los datos disponibles no muestran una desviación importante respecto al plan actual.');

  return { score, load, compliance, paceHr, weekKm:+weekKm.toFixed(1), target, longRunKm:+todayLongRun.toFixed(1), recommendations:rec };
}

      <div class="stat-card"><div class="val font-display">${projectionLabel}</div><div class="lbl">Proyección maratón</div></div>
      <div class="stat-card"><div class="val font-display">${targetLabel}</div><div class="lbl">Objetivo maratón</div></div>

function weekLongRunReal(week) {
  // La tirada larga no siempre cae justo el domingo asignado — viajes, reposición
  // de días, etc. Buscamos así, en orden:
  // 1) Si esa sesión se repuso corriendo en otra fecha real, usamos esa carrera exacta.
  // 2) Si no, tomamos la carrera más larga dentro de la semana completa del plan
  //    (sin exigir que sea justo el domingo).
  const day3Key = `${week.week}-3`;
  const madeUp = S.madeUpSessions ? S.madeUpSessions[day3Key] : null;
  const runs = Object.values(S.activities).filter(a => ['Run','TrailRun'].includes(a.sportType));

  let candidates;
  if (madeUp && S.sessionsDone[day3Key]) {
    candidates = runs.filter(a => a.date === madeUp.date);
  } else {
    candidates = runs.filter(a => {
      const d = new Date(a.date + 'T00:00:00');
      return d >= week.start && d <= week.end && d <= today;
    });
  }
  if (!candidates.length) return { km: 0, minutes: 0 };
  const best = candidates.reduce((max, a) => (Number(a.distanceKm) || 0) > (Number(max.distanceKm) || 0) ? a : max, candidates[0]);
  return { km: Number(best.distanceKm) || 0, minutes: (Number(best.movingTimeSec) || 0) / 60 };
}

function weekLongRunRealKm(week) {
  return weekLongRunReal(week).km;
}

function evolutionBarRow(weekNum, label, pct, subtext) {
  return `<div style="margin-top:9px;"><div style="display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.6);"><span>Sem ${weekNum}</span><span>${label}</span></div><div style="height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:4px;"><div style="height:100%;width:${pct}%;background:#FFCC00;"></div></div><div style="font-size:10px;color:rgba(255,255,255,.38);margin-top:3px;">${subtext}</div></div>`;
}

function renderWeeklyEvolutionCard() {
  const rows=[];
  const idx=currentWeekIndex();
  for(let i=Math.max(0,idx-3);i<=Math.min(PLAN.length-1,idx);i++) {
    const w=PLAN[i], weeklyKm=weekRealKm(w), target=w.longRunTarget;
    const real = weekLongRunReal(w);
    const due = today >= w.day3Date;
    const weeklyKmText = `${weeklyKm.toFixed(1)} km totales en la semana`;

    if (target.unit === 'km') {
      const targetText = target.min === target.max ? `${target.min} km` : target.label;
      const pct = due && target.min > 0 ? Math.min(100, (real.km / target.min) * 100) : 0;
      const longLabel = due ? `${real.km.toFixed(1)} / ${targetText} · tirada larga` : `Pendiente · ${targetText} · tirada larga`;
      rows.push(evolutionBarRow(w.week, longLabel, pct, weeklyKmText));
    } else if (target.unit === 'min') {
      const targetText = target.min === target.max ? `${target.min} min` : target.label;
      const pct = due && target.min > 0 ? Math.min(100, (real.minutes / target.min) * 100) : 0;
      const longLabel = due ? `${real.minutes.toFixed(0)} / ${targetText} · tirada larga` : `Pendiente · ${targetText} · tirada larga`;
      rows.push(evolutionBarRow(w.week, longLabel, pct, weeklyKmText));
    } else {
      rows.push(evolutionBarRow(w.week, `${weeklyKm.toFixed(1)} km totales`, 0, 'Sin objetivo definido para esta semana'));
    }
  }
  return `<div class="backup-card"><div class="eyebrow">Evolución semanal</div><div style="font-size:10px;color:rgba(255,255,255,.38);margin-top:3px;">La barra compara tu tirada larga real contra el objetivo de esa semana — en km si el plan la da en km, en minutos si el plan la da en minutos.</div>${rows.join('')}</div>`;
}

function parseHMSInput(value) {
  const parts=String(value).trim().split(':').map(Number);
  if(!parts.length || parts.some(v => !Number.isFinite(v) || v < 0)) return null;
  if(parts.length===3 && parts[1] < 60 && parts[2] < 60) return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2 && parts[1] < 60) return parts[0]*60+parts[1];
  return null;
}


function getTodayPlannedSession() {
  const w = PLAN.find(w => today >= w.start && today <= w.end);
  if (!w) return null;
  const items = [[1,w.day1Date,w.day1],[2,w.day2Date,w.day2],[3,w.day3Date,w.day3]];
  const hit = items.find(([idx,d]) => fmt(d) === fmt(today));
  return hit ? { week:w, dayIdx:hit[0], date:hit[1], text:hit[2], key:`${w.week}-${hit[0]}` } : null;
}

function shoeKmUsed() {

  return Object.values(S.activities)
    .filter(a => a.date >= start && a.date <= fmt(today))
    .reduce((sum, a) => { const km=Number(a.distanceKm); return sum + (Number.isFinite(km) ? km : 0); }, 0);
}

function renderShoeCard() {
  const used = shoeKmUsed();
  const threshold = S.shoes.thresholdKm || 550;
  const pct = Math.min(100, (used / threshold) * 100);
  let status = 'ok', label = 'Vas bien';
  if (used >= threshold) { status = 'danger'; label = 'Ya pasaron su vida útil recomendada'; }
  else if (used >= threshold * 0.85) { status = 'warn'; label = 'Se están acercando al límite'; }
  const color = status === 'danger' ? '#f87171' : status === 'warn' ? '#facc15' : '#4ade80';
  const borderColor = status === 'danger' ? 'rgba(248,113,113,0.4)' : status === 'warn' ? 'rgba(250,204,21,0.4)' : 'rgba(255,255,255,0.08)';
  return `

      <div style="width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${color};"></div>

function saveShoeSettings() {
  const name = document.getElementById('shoeNameInput').value.trim();
  const start = document.getElementById('shoeStartInput').value;
  const threshold = parseFloat(document.getElementById('shoeThresholdInput').value);
  const old = { name:S.shoes.name, startDate:S.shoes.startDate, thresholdKm:S.shoes.thresholdKm };
  const nextName = name || 'Tenis';
  const nextStart = start || fmt(today);
  const nextThreshold = threshold > 0 ? threshold : 550;
  if (S.shoes.name && (old.name !== nextName || old.startDate !== nextStart) && shoeKmUsed() > 0) {
    S.shoes.history = Array.isArray(S.shoes.history) ? S.shoes.history : [];
    S.shoes.history.unshift({ ...old, retiredDate:fmt(today), usedKm:+shoeKmUsed().toFixed(1) });
    S.shoes.history = S.shoes.history.slice(0,10);
  }
  S.shoes.name = nextName;
  S.shoes.startDate = nextStart;
  S.shoes.thresholdKm = nextThreshold;
  persist();
  document.getElementById('modalRoot').innerHTML = '';
  showToast('Tenis actualizados ✅');
  render();
}

      </div>
    </div>

}

function saveRace(existingId) {
  const name = document.getElementById('raceNameInput').value.trim();
  const date = document.getElementById('raceDateInput').value;
  const distSelect = document.getElementById('raceDistanceSelect').value;
  const distCustom = parseFloat(document.getElementById('raceDistanceCustom').value);
  const distanceKm = distSelect === 'custom' ? distCustom : parseFloat(distSelect);
  const h = parseInt(document.getElementById('raceHInput').value, 10) || 0;
  const m = parseInt(document.getElementById('raceMInput').value, 10) || 0;
  const s = parseInt(document.getElementById('raceSInput').value, 10) || 0;
  const timeSec = h * 3600 + m * 60 + s;
  const notes = document.getElementById('raceNotesInput').value.trim();

  if (!name) { showToast('Ponle un nombre al evento'); return; }
  if (!date) { showToast('Falta la fecha'); return; }
  if (!Number.isFinite(distanceKm) || distanceKm <= 0) { showToast('Falta la distancia'); return; }
  if (m < 0 || m > 59 || s < 0 || s > 59 || h < 0 || h > 99) { showToast('Tiempo inválido'); return; }

  const race = {
    id: existingId || ('race_' + Date.now()),
    name, date, distanceKm,
    timeSec: timeSec > 0 ? timeSec : null,
    notes,
  };

  S.races = S.races || [];
  const idx = S.races.findIndex(r => r.id === race.id);
  if (idx >= 0) S.races[idx] = race; else S.races.push(race);
  S.races.sort((a, b) => b.date.localeCompare(a.date));

  persist();
  document.getElementById('modalRoot').innerHTML = '';
  showToast(existingId ? 'Carrera actualizada ✅' : 'Carrera registrada ✅');
  render();
}

function deleteRace(id) {
  const ok = window.confirm('¿Eliminar este registro de carrera? No se puede deshacer.');
  if (!ok) return;
  S.races = (S.races || []).filter(r => r.id !== id);
  persist();
  document.getElementById('modalRoot').innerHTML = '';
  showToast('Carrera eliminada');
  render();
}

/* ---------------------------------------------------------------
   ESTADÍSTICAS, PROYECCIÓN Y RECOMENDACIONES (100% desde Strava)
--------------------------------------------------------------- */
function secToHMS(sec) {
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function computePRs() {
  const results = {};
  PR_BUCKETS.forEach(b => { results[b.key] = null; });

  // Una actividad normal de entrenamiento no se considera PR solo por tener
  // una distancia cercana a 5K/10K/etc. Las marcas aquí requieren un tiempo
  // de carrera registrado explícitamente.
  (S.races || []).forEach(r => {
    if (r.date > fmt(today)) return;
    if (!r.timeSec || !Number.isFinite(r.distanceKm) || r.distanceKm <= 0) return;
    PR_BUCKETS.forEach(b => {
      const lo = b.km * (1 - b.tolerance), hi = b.km * (1 + b.tolerance);
      if (r.distanceKm >= lo && r.distanceKm <= hi) {
        const cur = results[b.key];
        if (!cur || r.timeSec < cur.timeSec) {
          results[b.key] = { timeSec: r.timeSec, date: r.date, source: 'Carrera registrada', distanceKm: r.distanceKm };
        }
      }
    });
  });
  return results;
}

function renderPRsBlock() {
  const prs = computePRs();
  const anyData = PR_BUCKETS.some(b => prs[b.key]);
  if (!anyData) return '';

  const rows = PR_BUCKETS.map(b => {
    const r = prs[b.key];
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);">
        <div style="font-size:13px;font-weight:600;">${b.label}</div>
        ${r
          ? `<div style="text-align:right;">
               <div style="font-size:13px;color:#FFCC00;font-weight:700;">${secToHMS(r.timeSec)}</div>
               <div style="font-size:10px;color:rgba(255,255,255,0.4);">${fmtShort(new Date(r.date + 'T00:00:00'))} · ${r.source}</div>
             </div>`
          : `<div style="font-size:12px;color:rgba(255,255,255,0.3);">Sin marca</div>`}
      </div>
    `;
  }).join('');

  return `
    <div class="dashed-rule"></div>
    <div style="margin-top:12px;">
      <div class="eyebrow" style="margin-bottom:8px;">Tus mejores marcas registradas</div>
      ${rows}
    </div>
  `;
}

function renderMadeUpBlock() {
  const entries = Object.entries(S.madeUpSessions)
    .filter(([key]) => S.sessionsDone[key]) // solo las que siguen marcadas (por si se desmarcó a mano)
    .sort(([, a], [, b]) => a.date.localeCompare(b.date));
  if (!entries.length) return '';

  const dayLabelFor = (n) => n === 1 ? 'Día 1 · Fácil' : n === 2 ? 'Día 2 · Calidad' : 'Día 3 · Larga';

function drawSmoothPath(ctx, pts) {
  // Curva suave tipo Catmull-Rom (la misma técnica de apps como Strava/Oura)
  // en vez de líneas rectas entre punto y punto.
  if (pts.length < 2) return;
  ctx.moveTo(pts[0].x, pts[0].y);
  if (pts.length === 2) { ctx.lineTo(pts[1].x, pts[1].y); return; }
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
  }
}

function linearRegression(points) {
  // Mínimos cuadrados: y = intercept + slope*x. Usa TODOS los puntos, no solo
  // el primero y el último, así un solo dato ruidoso no distorsiona la tendencia.
  const n = points.length;
  if (n < 2) return null;
  const sumX = points.reduce((s, p) => s + p.x, 0);
  const sumY = points.reduce((s, p) => s + p.y, 0);
  const sumXY = points.reduce((s, p) => s + p.x * p.y, 0);
  const sumX2 = points.reduce((s, p) => s + p.x * p.x, 0);
  const denom = n * sumX2 - sumX * sumX;
  if (denom === 0) return null;
  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  return { slope, intercept };
}

function computeEFData() {
  return Object.values(S.activities)
    .filter(a => a.date <= fmt(today) && a.avgHr && a.avgSpeed && a.movingTimeSec >= 900) // mín. 15 min, con FC real
    .filter(a => a.workoutType === 0 || a.workoutType === 2 || a.workoutType === undefined || a.workoutType === null) // solo trote normal o carrera larga; excluye carreras (1) e intervalos/calidad (3)
    .sort((a, b) => a.date.localeCompare(b.date))
    .map(a => ({ date: a.date, ef: +((a.avgSpeed * 60) / a.avgHr).toFixed(3) }));
}

function computeDistanceRatio() {
  // Ratio descriptivo de distancia: 7 días / media semanal de los 21 días previos.
  // No se presenta como una medida clínica de carga total.
  return computeLoadAnalytics();
}

function getReferenceRace() {
  const candidates = [];
  (S.races || []).forEach(r => {
    if (r.date > fmt(today)) return;
    if (r.timeSec > 0 && r.distanceKm > 0) candidates.push({ timeSec:r.timeSec, distanceKm:r.distanceKm, date:r.date, source:'Carrera registrada' });
  });
  Object.values(S.activities).forEach(a => {
    if (a.date <= fmt(today) && ['Run','TrailRun'].includes(a.sportType) && a.workoutType === 1 && a.movingTimeSec > 0 && a.distanceKm >= 5) {
      candidates.push({ timeSec:a.movingTimeSec, distanceKm:a.distanceKm, date:a.date, source:'Strava · carrera' });
    }
  });
  candidates.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return candidates[0] || null;
}

function computeProgressStats() {
  const runs = Object.values(S.activities).filter(a => ['Run','TrailRun'].includes(a.sportType));
  if (!runs.length) return null;

  const validDistanceRuns = runs.filter(a => Number(a.distanceKm) > 0 && Number(a.movingTimeSec) > 0);
  const totalKm = validDistanceRuns.reduce((s, a) => s + Number(a.distanceKm), 0);
  const totalSec = validDistanceRuns.reduce((s, a) => s + Number(a.movingTimeSec), 0);
  const avgPaceSecPerKm = totalKm > 0 ? totalSec / totalKm : null;

  const longest = validDistanceRuns.reduce((max, a) => (!max || a.distanceKm > max.distanceKm) ? a : max, null);

  const weeklyKm = PLAN.map(w => ({ week: w.week, start: w.start, km: +weekRealKm(w).toFixed(2) }));
  const growthRates = [];
  for (let i = 1; i < weeklyKm.length; i++) {
    const prev = weeklyKm[i - 1], cur = weeklyKm[i];
    if (prev.km > 0 && cur.km > 0) growthRates.push((cur.km - prev.km) / prev.km);
  }
  const avgGrowthPct = growthRates.length ? +((growthRates.reduce((a,b)=>a+b,0)/growthRates.length)*100).toFixed(1) : null;

  const { expected: expectedCount, done: doneCount } = getCompletedExpectedSessionCount();
  const compliancePct = expectedCount ? Math.round((doneCount / expectedCount) * 100) : null;

  const withCadence = validDistanceRuns.filter(a => Number(a.avgCadence) > 0);
  // Strava entrega average_cadence de una sola pierna: se multiplica x2 para pasos/min reales.
  const cadenceWeight = withCadence.reduce((s,a)=>s+(Number(a.movingTimeSec)||0),0);
  const avgCadenceSpm = withCadence.length && cadenceWeight > 0
    ? Math.round(withCadence.reduce((s,a)=>s+Number(a.avgCadence)*2*(Number(a.movingTimeSec)||0),0)/cadenceWeight)
    : withCadence.length ? Math.round(withCadence.reduce((s,a)=>s+Number(a.avgCadence)*2,0)/withCadence.length) : null;

  let referenceRace = getReferenceRace();
  if (!referenceRace && longest && longest.distanceKm >= 5) {
    // Sin carrera de competencia registrada: usamos tu entrenamiento más largo
    // como aproximación (menos confiable que una carrera real, se marca así abajo).
    referenceRace = { timeSec: longest.movingTimeSec, distanceKm: longest.distanceKm, date: longest.date, source: 'tu entrenamiento más largo (no es una carrera real)' };
  }
  let projectedRaceSec = null;
  if (referenceRace && referenceRace.distanceKm > 0 && referenceRace.distanceKm < 42.195) {
    projectedRaceSec = referenceRace.timeSec * Math.pow(42.195 / referenceRace.distanceKm, 1.06);
  } else if (referenceRace && referenceRace.distanceKm === 42.195) {
    projectedRaceSec = referenceRace.timeSec;
  }

  const peakWeek = PLAN.reduce((max,w) => {
    const km = w.longRunTarget?.unit === 'km' ? w.longRunTarget.max : null;
    const maxKm = max?.longRunTarget?.unit === 'km' ? max.longRunTarget.max : null;
    return (km !== null && (maxKm === null || km > maxKm)) ? w : max;
  }, null);
  const peakTargetKm = peakWeek?.longRunTarget?.unit === 'km' ? peakWeek.longRunTarget.max : null;
  const weeksToPeak = peakWeek ? Math.max(0, Math.round((peakWeek.start - today) / DAY_MS / 7)) : null;
  const maxRecordedDistance = longest ? longest.distanceKm : 0;
  const kmNeededToPeak = peakTargetKm !== null ? +(peakTargetKm - maxRecordedDistance).toFixed(1) : null;

  return {
    totalKm:+totalKm.toFixed(1), totalRuns:validDistanceRuns.length, avgPaceSecPerKm,
    longest, avgGrowthPct, compliancePct, doneCount, expectedCount,
    avgCadenceSpm, projectedRaceSec, referenceRace, peakWeek, peakTargetKm, weeksToPeak, kmNeededToPeak,
  };
}

function renderProgressSection() {
  const st = computeProgressStats();
  if (!st) {
    return `

        ${renderPRsBlock()}
        ${renderMadeUpBlock()}

  }

  const avgPaceRounded = Math.round(st.avgPaceSecPerKm);
  const paceStr = `${Math.floor(avgPaceRounded/60)}:${(avgPaceRounded%60).toString().padStart(2,'0')} /km`;

  const growthWarning = st.avgGrowthPct !== null && st.avgGrowthPct > 10;
  const growthNote = st.avgGrowthPct === null ? 'Aún no hay suficientes semanas con datos para calcular tu ritmo de progresión.'
    : growthWarning
      ? `El cambio medio entre semanas consecutivas con datos es de ~${st.avgGrowthPct}%, por encima del 10% recomendado para subir kilometraje sin forzar de más.`
      : `El cambio medio entre semanas consecutivas con datos es de ~${st.avgGrowthPct}%. Es una descripción estadística, no un umbral médico.`;

  const complianceNote = st.compliancePct === null ? ''
    : st.compliancePct >= 90 ? `Cumplimiento del plan: ${st.compliancePct}% — excelente disciplina.`

    : `Cumplimiento del plan: ${st.compliancePct}% — vas dejando sesiones sin correr; esto puede afectar tu resistencia de cara al maratón.`;

  const acwr = computeDistanceRatio();
  const acwrNote = !acwr ? null
    : acwr.acwr < 0.8 ? { color: '#facc15', text: `Ratio de distancia: ${acwr.acwr} — 7 días: ${acwr.km7} km frente a una media de ${acwr.chronicWeeklyAvg} km/sem en los 21 días previos.` }
    : acwr.acwr <= 1.3 ? { color: '#4ade80', text: `Ratio de distancia: ${acwr.acwr} — 7 días: ${acwr.km7} km frente a una media de ${acwr.chronicWeeklyAvg} km/sem en los 21 días previos.` }
    : acwr.acwr <= 1.5 ? { color: '#facc15', text: `Ratio de distancia: ${acwr.acwr} — la distancia reciente está por encima de la media previa (${acwr.km7} vs. ${acwr.chronicWeeklyAvg} km/sem).` }
    : { color: '#f87171', text: `Ratio de distancia: ${acwr.acwr} — la distancia reciente está muy por encima de la media previa (${acwr.km7} vs. ${acwr.chronicWeeklyAvg} km/sem).` };

  const cadenceNote = st.avgCadenceSpm === null ? ''
    : `Cadencia promedio registrada: ~${st.avgCadenceSpm} pasos/min.`;

  const peakProjection = st.peakWeek
    ? (st.kmNeededToPeak <= 0
        ? `Ya superaste los ${st.peakTargetKm} km de tu semana pico (${st.peakWeek.week}) en tu carrera más larga hasta hoy. Cuidado con no forzar de más antes de tiempo.`
        : `Te faltan ${st.kmNeededToPeak} km para llegar a tu carrera larga máxima de ${st.peakTargetKm} km (semana ${st.peakWeek.week}, ${st.weeksToPeak} semana(s) a partir de hoy). La diferencia es solo una referencia matemática entre tu distancia máxima registrada y el objetivo del plan.`)
    : '';

  const reference = st.referenceRace;
  const riegelReliability = !reference ? ''
    : reference.distanceKm >= 21 ? ' Al venir de una distancia de medio maratón o más, esta es la proyección más confiable que da Riegel.'
    : reference.distanceKm >= 15 ? ' Ojo: viene de una distancia todavía bastante menor al maratón, así que tómala con reserva moderada — se vuelve más precisa conforme corras más largo.'
    : ' Ojo: es una extrapolación muy amplia (de menos de 15 km a 42.195 km), la fórmula de Riegel pierde precisión en saltos así de grandes — tómala solo como referencia lejana, no como predicción real todavía.';
  const raceProjectionNote = st.projectedRaceSec && reference
    ? `Usando tu referencia de ${reference.distanceKm.toFixed(2)} km en ${secToHMS(reference.timeSec)} (${reference.source}, ${fmtShort(new Date(reference.date + 'T00:00:00'))}), la fórmula de Riegel (1.06) estima <strong>${secToHMS(st.projectedRaceSec)}</strong> para 42.195 km. Es una extrapolación matemática, no una garantía de rendimiento.${riegelReliability}`
    : `Necesitas al menos un entrenamiento de 5 km o más para calcular una proyección de tiempo de maratón.`;

  const cadenceData = Object.values(S.activities)
    .filter(a => a.avgCadence)
    .sort((a, b) => a.date.localeCompare(b.date))
    .map(a => ({ date: a.date, cadence: Math.round(a.avgCadence * 2) }));
  let cadenceTrend = null;
  if (cadenceData.length >= 2) {
    cadenceTrend = linearRegression(cadenceData.map((d, i) => ({ x: i, y: d.cadence })));
    setTimeout(() => drawCadenceChart(cadenceData, cadenceTrend), 0);
  }
  let cadenceTrendNote = '';
  if (cadenceTrend && cadenceData.length >= 4) {

  const efData = computeEFData();

  }
  let efDeltaNote = '';
  if (efTrend && efData.length >= 4) {
    const fittedFirst = efTrend.intercept;
    const fittedLast = efTrend.intercept + efTrend.slope * (efData.length - 1);
    const pctChange = (((fittedLast - fittedFirst) / fittedFirst) * 100).toFixed(1);
    efDeltaNote = ` Tendencia por regresión lineal sobre ${efData.length} carreras: ${pctChange > 0 ? '+' : ''}${pctChange}%.`;
  } else if (efData.length >= 2) {
    efDeltaNote = ` Con solo ${efData.length} carreras que califican todavía no aparece la línea celeste de tendencia — se dibuja sola en cuanto tengas 4 o más.`;
  }

  return `
    <div class="card" style="margin-top:20px;">
      <div class="eyebrow">Tu progreso real (datos de Strava)</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;">
        <div style="background:#151515;border-radius:12px;padding:10px;">
          <div style="font-size:11px;color:rgba(255,255,255,0.5);">Total corrido</div>
          <div class="font-display" style="font-size:20px;color:#FFCC00;">${st.totalKm} km</div>
        </div>
        <div style="background:#151515;border-radius:12px;padding:10px;">
          <div style="font-size:11px;color:rgba(255,255,255,0.5);">Actividades de carrera</div>
          <div class="font-display" style="font-size:20px;color:#FFCC00;">${st.totalRuns}</div>
        </div>
        <div style="background:#151515;border-radius:12px;padding:10px;">
          <div style="font-size:11px;color:rgba(255,255,255,0.5);">Ritmo promedio</div>
          <div class="font-display" style="font-size:20px;color:#FFCC00;">${paceStr}</div>
        </div>
        <div style="background:#151515;border-radius:12px;padding:10px;">
          <div style="font-size:11px;color:rgba(255,255,255,0.5);">Distancia máxima registrada</div>
          <div class="font-display" style="font-size:20px;color:#FFCC00;">${st.longest ? st.longest.distanceKm : '—'} km</div>
        </div>
      </div>

      <div class="dashed-rule"></div>

      <div style="margin-top:12px;">

function drawCadenceChart(data, trend) {
  const canvas = document.getElementById('cadenceCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const pad = { top: 22, right: 12, bottom: 20, left: 32 };
  const REF = 170; // cadencia mínima recomendada
  const values = data.map(d => d.cadence);
  const min = Math.min(...values, REF) - 6;
  const max = Math.max(...values, REF) + 6;
  const xStep = (w - pad.left - pad.right) / Math.max(1, data.length - 1);
  const yFor = (val) => h - pad.bottom - ((val - min) / (max - min)) * (h - pad.top - pad.bottom);
  const xFor = (i) => pad.left + i * xStep;

  const pts = data.map((d, i) => ({ x: xFor(i), y: yFor(d.cadence) }));

  ctx.clearRect(0, 0, w, h);

  // líneas guía horizontales con su valor, para leer el eje sin adivinar
  ctx.font = '9px Inter, sans-serif';
  ctx.textAlign = 'right';
  const gridSteps = 3;
  for (let g = 0; g <= gridSteps; g++) {
    const val = min + ((max - min) / gridSteps) * g;
    const y = yFor(val);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText(val.toFixed(0), pad.left - 6, y + 3);
  }

  // línea de referencia a 170 spm (mínimo recomendado), etiquetada directo
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.3;
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(pad.left, yFor(REF));
  ctx.lineTo(w - pad.right, yFor(REF));
  ctx.stroke();
  ctx.setLineDash([]);

  // línea de tendencia (regresión lineal) en color distinto para no confundirla con la de arriba
  if (trend && data.length >= 4) {
    ctx.strokeStyle = '#7dd3fc';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(xFor(0), yFor(trend.intercept));
    ctx.lineTo(xFor(data.length - 1), yFor(trend.intercept + trend.slope * (data.length - 1)));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // relleno degradado bajo la curva
  const grad = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
  grad.addColorStop(0, 'rgba(74,222,128,0.3)');
  grad.addColorStop(1, 'rgba(74,222,128,0)');
  ctx.beginPath();
  drawSmoothPath(ctx, pts);
  ctx.lineTo(pts[pts.length - 1].x, h - pad.bottom);
  ctx.lineTo(pts[0].x, h - pad.bottom);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // curva suave de tu cadencia real, carrera por carrera
  ctx.beginPath();
  drawSmoothPath(ctx, pts);
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 2.8;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  const showAllLabels = data.length <= 8;
  pts.forEach((p, i) => {
    const isLast = i === pts.length - 1;

    if (isLast) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(74,222,128,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, isLast ? 5 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = isLast ? '#fff' : '#4ade80';
    ctx.fill();

    if (showAllLabels || i === 0 || isLast) {
      ctx.textAlign = 'center';
      ctx.fillStyle = isLast ? '#fff' : '#4ade80';
      ctx.font = 'bold 10px Inter, sans-serif';
      ctx.fillText(data[i].cadence.toFixed(0), p.x, p.y - (isLast ? 14 : 10));
    }

    if (i === 0 || isLast || data.length <= 5) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '9px Inter, sans-serif';
      ctx.fillText(fmtShort(new Date(data[i].date + 'T00:00:00')), p.x, h - 4);
    }
  });
}

function drawEFChart(data, trend) {
  const canvas = document.getElementById('efCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width, h = rect.height;
  const pad = { top: 26, right: 14, bottom: 22, left: 36 };
  const baseline = data[0].ef; // tu primer registro comparable, como referencia
  const values = data.map(d => d.ef);
  const min = Math.min(...values, baseline) - 0.06;
  const max = Math.max(...values, baseline) + 0.06;
  const xStep = (w - pad.left - pad.right) / Math.max(1, data.length - 1);
  const yFor = (val) => h - pad.bottom - ((val - min) / (max - min)) * (h - pad.top - pad.bottom);
  const xFor = (i) => pad.left + i * xStep;
  const pts = data.map((d, i) => ({ x: xFor(i), y: yFor(d.ef) }));

  ctx.clearRect(0, 0, w, h);

  // líneas guía horizontales con su valor
  ctx.font = '9px Inter, sans-serif';
  ctx.textAlign = 'right';
  const gridSteps = 3;
  for (let g = 0; g <= gridSteps; g++) {
    const val = min + ((max - min) / gridSteps) * g;
    const y = yFor(val);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText(val.toFixed(2), pad.left - 6, y + 3);
  }

  // tu punto de partida, etiquetado directo
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.3;
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(pad.left, yFor(baseline));
  ctx.lineTo(w - pad.right, yFor(baseline));
  ctx.stroke();
  ctx.setLineDash([]);

  // línea de tendencia — solo con 4+ carreras, en celeste para no confundirla
  if (trend && data.length >= 4) {
    ctx.strokeStyle = '#7dd3fc';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(xFor(0), yFor(trend.intercept));
    ctx.lineTo(xFor(data.length - 1), yFor(trend.intercept + trend.slope * (data.length - 1)));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // relleno degradado bajo la curva
  const grad = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
  grad.addColorStop(0, 'rgba(192,132,252,0.35)');
  grad.addColorStop(1, 'rgba(192,132,252,0)');
  ctx.beginPath();
  drawSmoothPath(ctx, pts);
  ctx.lineTo(pts[pts.length - 1].x, h - pad.bottom);
  ctx.lineTo(pts[0].x, h - pad.bottom);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // curva suave principal
  ctx.beginPath();
  drawSmoothPath(ctx, pts);
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 2.8;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  const showAllLabels = data.length <= 8;
  pts.forEach((p, i) => {
    const isLast = i === pts.length - 1;

    if (isLast) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(192,132,252,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, isLast ? 5 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = isLast ? '#fff' : '#c084fc';
    ctx.fill();

    if (showAllLabels || i === 0 || isLast) {
      ctx.textAlign = 'center';
      ctx.fillStyle = isLast ? '#fff' : '#c084fc';
      ctx.font = 'bold 10px Inter, sans-serif';
      ctx.fillText(data[i].ef.toFixed(2), p.x, p.y - (isLast ? 14 : 10));
    }
    if (i === 0 || isLast || data.length <= 5) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '9px Inter, sans-serif';
      ctx.fillText(fmtShort(new Date(data[i].date + 'T00:00:00')), p.x, h - 4);
    }
  });
}

function renderCalendar() {
  const year = S.calendarView.getFullYear();
  const month = S.calendarView.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(year, month, d);
    const dateStr = fmt(dt);
    const isRun = S.runDays.includes(dateStr);
    const isToday = dateStr === fmt(today);
    const isWeighDay = dt.getDay() === 1;
    cells += `
      <button class="cal-day ${isRun ? 'run' : ''} ${isToday ? 'today' : ''}" data-toggle-day="${dateStr}">
        ${isRun ? icon('zap', 14, '#000').replace('stroke-width="2"','stroke-width="3"') : d}
        ${isWeighDay && !isRun ? `<span class="weigh-dot"></span>` : ''}

  const monthRuns = S.runDays.filter(d => {

function renderPeso() {
  const startWeight = S.weightSettings.startWeight;
  const monthDays = WEIGH_DAYS.filter(d => d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth());
  const chartData = Object.entries(S.weighIns)
    .filter(([date]) => date <= fmt(today))
    .sort(([a],[b]) => a < b ? -1 : 1)
    .map(([date, weight]) => ({ date, weight: parseFloat(weight) }));
  const lastWeight = chartData.length ? chartData[chartData.length-1].weight : startWeight;
  const delta = +(lastWeight - startWeight).toFixed(1);
  const targetWeight = S.weightSettings.targetWeight;
  let weeklyTrend = null;
  let weeklyTrendReliable = false;
  if (chartData.length >= 2) {
    // Regresión lineal sobre TODOS los pesajes (no solo el primero y el último) —
    // un solo día raro (retención de líquidos, comida pesada) no distorsiona el resultado.
    // Con 2 puntos es matemáticamente solo la línea entre ellos; con 4+ ya es una
    // tendencia real que vale más la pena confiar.
    const t0 = new Date(chartData[0].date).getTime();
    const points = chartData.map(d => ({ x: (new Date(d.date).getTime() - t0) / DAY_MS, y: d.weight }));
    const trend = linearRegression(points);
    if (trend) weeklyTrend = +(trend.slope * 7).toFixed(2);
    weeklyTrendReliable = chartData.length >= 4;
  }

  let weightProjection = null;
  if (weeklyTrend !== null && targetWeight && weeklyTrend < 0 && lastWeight > targetWeight) {
    const weeks = (lastWeight - targetWeight) / Math.abs(weeklyTrend);
    const projected = new Date(today.getTime() + weeks * 7 * DAY_MS);
    weightProjection = `A esta tendencia, llegarías aproximadamente a ${targetWeight} kg en ${fmtShort(projected)}.`;
  }

  const monthName = MONTHS_ES[today.getMonth()];
  const monthLabel = `${monthName.charAt(0).toUpperCase()}${monthName.slice(1)} ${today.getFullYear()}`;

  const rows = monthDays.map(d => {
    const dateStr = fmt(d);
    const isToday = dateStr === fmt(today);
    const isFuture = d > today;
    const dayLabel = 'Lunes';
    const val = S.weighIns[dateStr] !== undefined ? S.weighIns[dateStr] : '';
    return `
      <div class="weigh-row ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}">
        <div>
          <div class="day">${dayLabel} ${isToday ? '<span style="color:#FFCC00;">· Hoy</span>' : ''}</div>
          <div class="date">${fmtShort(d)}</div>
        </div>
        ${isFuture
          ? `<div style="font-size:12px;color:rgba(255,255,255,0.4);">Próximo</div>`
          : `<div style="display:flex;align-items:center;gap:6px;">
              <input type="number" step="0.1" min="30" max="300" inputmode="decimal" placeholder="—" value="${val}" data-weight-date="${dateStr}">
              <span style="font-size:12px;color:rgba(255,255,255,0.4);">kg</span>
            </div>`}
